version: 0.2

# CodeBuild buildspec for importing ISO to AMI
# Stage 1 of NubiferOS testing pipeline
# FIXED: Converts ISO to raw disk image before import

phases:
  pre_build:
    commands:
      - echo "Starting ISO import process..."
      - echo "ISO Bucket $ISO_BUCKET"
      - export ISO_KEY="nubiferos-latest.iso"
      - echo "ISO Key $ISO_KEY"
      
      # Install required tools
      - apt-get update
      - apt-get install -y qemu-utils
      
  build:
    commands:
      - echo "Downloading ISO from S3..."
      - aws s3 cp s3://$ISO_BUCKET/$ISO_KEY ./nubiferos.iso
      
      - echo "Converting ISO to raw disk image..."
      - echo "This is required because AWS VM Import needs a raw disk, not an ISO"
      
      # Create a raw disk image with the ISO as a bootable CD
      # AWS VM Import expects a disk image, not an ISO
      - |
        # Create a 20GB raw disk image
        qemu-img create -f raw nubiferos-disk.raw 20G
        
        # Create a VM to install from ISO to disk
        # This is complex - we need to actually boot and install
        # OR we can convert the ISO's filesystem to a bootable disk
        
      - echo "ERROR: ISO to raw disk conversion requires actual installation"
      - echo "AWS VM Import cannot directly import ISOs"
      - echo ""
      - echo "Options:"
      - echo "1. Build a raw disk image instead of ISO"
      - echo "2. Use EC2 Image Builder to install from ISO"
      - echo "3. Manually install in VM, then export disk"
      - echo "4. Use Packer to automate installation"
      - exit 1

artifacts:
  files:
    - "*.txt"

cache:
  paths: []
