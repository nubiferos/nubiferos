version: 0.2

# CodeBuild buildspec for testing NubiferOS ISO locally with QEMU
# This downloads the ISO from S3 and tests it without conversion

env:
  variables:
    ISO_BUCKET: "nubiferos-iso-builds"
    ISO_KEY: "nubiferos-latest.iso"
    ISO_LOCAL_PATH: "./iso/nubiferos-latest.iso"

phases:
  pre_build:
    commands:
      - echo "=========================================="
      - echo "NubiferOS ISO Testing"
      - echo "=========================================="
      - echo ""
      
      - echo "Installing test dependencies..."
      - apt-get update -qq
      - apt-get install -y qemu-system-x86 qemu-utils python3-pip genisoimage
      - pip3 install pytest
      
      - echo "Creating ISO directory..."
      - mkdir -p ./iso
      - rm -f ./iso/*.iso  # Remove any existing ISOs to save space
      
  build:
    commands:
      - echo "Verifying ISO exists in S3..."
      - |
        if ! aws s3 ls s3://$ISO_BUCKET/$ISO_KEY > /dev/null 2>&1; then
          echo "❌ ERROR: ISO not found in S3"
          echo ""
          echo "Bucket: $ISO_BUCKET"
          echo "Key: $ISO_KEY"
          echo "Full path: s3://$ISO_BUCKET/$ISO_KEY"
          echo ""
          echo "Available ISOs in bucket:"
          aws s3 ls s3://$ISO_BUCKET/ --recursive | grep .iso || echo "No ISOs found"
          echo ""
          echo "Please upload the ISO to S3 or update the ISO_BUCKET and ISO_KEY environment variables."
          exit 1
        fi
      
      - echo "✅ ISO found in S3"
      - echo "Downloading ISO from S3..."
      - |
        echo "Bucket: s3://$ISO_BUCKET/$ISO_KEY"
        aws s3 cp s3://$ISO_BUCKET/$ISO_KEY $ISO_LOCAL_PATH
      
      - echo "ISO downloaded successfully"
      - ls -lh $ISO_LOCAL_PATH
      - |
        ISO_SIZE=$(du -h $ISO_LOCAL_PATH | cut -f1)
        echo "ISO Size: $ISO_SIZE"
        
        # Verify ISO is not empty
        ISO_SIZE_BYTES=$(stat -c%s "$ISO_LOCAL_PATH")
        if [ "$ISO_SIZE_BYTES" -lt 1000000 ]; then
          echo "❌ ERROR: ISO file is too small ($ISO_SIZE_BYTES bytes)"
          echo "The ISO might be corrupted or incomplete"
          exit 1
        fi
        echo "✅ ISO size looks reasonable: $ISO_SIZE ($ISO_SIZE_BYTES bytes)"
        
        # Verify checksum
        echo "Verifying ISO integrity..."
        S3_ETAG=$(aws s3api head-object --bucket $ISO_BUCKET --key $ISO_KEY --query ETag --output text | tr -d '"')
        LOCAL_MD5=$(md5sum $ISO_LOCAL_PATH | cut -d' ' -f1)
        
        echo "S3 ETag: $S3_ETAG"
        echo "Local MD5: $LOCAL_MD5"
        
        if [ "$S3_ETAG" = "$LOCAL_MD5" ]; then
          echo "✅ Checksum verified - ISO downloaded correctly"
        else
          echo "⚠️  Checksum mismatch - this might be a multipart upload (ETag won't match MD5)"
          echo "Proceeding anyway, but ISO might be corrupted if download failed"
        fi
      
      - echo ""
      - echo "=========================================="
      - echo "Running Automated Tests"
      - echo "=========================================="
      - echo ""
      
      # Run pytest tests
      - |
        cd testing
        export ISO_PATH="$CODEBUILD_SRC_DIR/$ISO_LOCAL_PATH"
        pytest test-iso-pytest.py -v --tb=short
        cd ..
      
      - echo ""
      - echo "=========================================="
      - echo "Running Boot Test"
      - echo "=========================================="
      - echo ""
      
      # Test that ISO boots in QEMU (headless, 60 second timeout)
      - |
        echo "Starting QEMU boot test (60 seconds)..."
        
        # Create temporary disk
        qemu-img create -f qcow2 test-disk.qcow2 20G
        
        # Start QEMU in background with serial output
        timeout 60 qemu-system-x86_64 \
          -cdrom $ISO_LOCAL_PATH \
          -boot d \
          -m 4096 \
          -smp 2 \
          -drive file=test-disk.qcow2,format=qcow2 \
          -display none \
          -serial stdio \
          -no-reboot \
          > qemu-output.log 2>&1 || true
        
        # Check if boot was successful
        if grep -q "Welcome\|login\|GRUB\|boot" qemu-output.log; then
          echo "✅ ISO boot test PASSED - Boot messages detected"
        else
          echo "⚠️  ISO boot test - No clear boot messages detected"
          echo ""
          echo "=== Full QEMU Output ==="
          cat qemu-output.log
          echo "=== End QEMU Output ==="
          echo ""
          echo "This might mean:"
          echo "  - ISO doesn't boot (check ISO build)"
          echo "  - Boot is too slow (increase timeout)"
          echo "  - Boot messages go to different output"
        fi
        
        # Cleanup
        rm -f test-disk.qcow2
      
  post_build:
    commands:
      - echo ""
      - echo "=========================================="
      - echo "Test Summary"
      - echo "=========================================="
      - echo ""
      - |
        echo "ISO: $ISO_KEY"
        echo "Size: $(du -h $ISO_LOCAL_PATH | cut -f1)"
      - echo ""
      
      # Check if pytest passed
      - |
        if [ -f testing/.pytest_cache/v/cache/lastfailed ]; then
          echo "❌ Some tests failed"
          exit 1
        else
          echo "✅ All tests passed!"
        fi
      
      - echo ""
      - echo "ISO is ready for distribution!"
      - echo ""
      
      # Cleanup ISO to save space
      - echo "Cleaning up ISO file..."
      - rm -f $ISO_LOCAL_PATH
      - echo "✅ Cleanup complete"

artifacts:
  files:
    - qemu-output.log
    - testing/.pytest_cache/**/*
  name: test-results

cache:
  paths: []  # Don't cache anything to save space

reports:
  pytest-results:
    files:
      - 'testing/test-results.xml'
    file-format: 'JUNITXML'
