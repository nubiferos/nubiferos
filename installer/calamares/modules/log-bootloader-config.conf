---
# Log bootloader configuration for debugging
dontChroot: false

script:
    - command: "/bin/bash"
      args:
        - "-c"
        - |
          # Run the config logger if it exists
          if [ -x /usr/local/bin/calamares-config-logger.sh ]; then
            /usr/local/bin/calamares-config-logger.sh
          else
            echo "WARNING: calamares-config-logger.sh not found"
          fi
          exit 0
      timeout: 30
