---
# Fix /dev bind mounts after mount module
# Calamares mount module can't handle bind mounts properly,
# so we do them manually here

dontChroot: true

script:
    - command: "/bin/bash"
      args:
        - "-c"
        - |
          echo "=========================================="
          echo "Fixing /dev bind mounts"
          echo "=========================================="
          
          # Find the Calamares root mount point
          ROOT_MOUNT=$(mount | grep 'calamares-root' | head -1 | awk '{print $3}')
          
          if [ -z "$ROOT_MOUNT" ]; then
            echo "ERROR: Could not find Calamares root mount"
            exit 1
          fi
          
          echo "Root mount point: $ROOT_MOUNT"
          
          # Bind mount /dev
          echo "Bind mounting /dev..."
          mount --bind /dev "$ROOT_MOUNT/dev"
          
          # Bind mount /dev/pts
          echo "Bind mounting /dev/pts..."
          mount --bind /dev/pts "$ROOT_MOUNT/dev/pts"
          
          # Bind mount /run/udev
          echo "Bind mounting /run/udev..."
          mount --bind /run/udev "$ROOT_MOUNT/run/udev"
          
          echo ""
          echo "Verifying mounts..."
          mount | grep "$ROOT_MOUNT"
          
          echo ""
          echo "Checking device visibility..."
          ls -la "$ROOT_MOUNT/dev/sd"* 2>/dev/null || ls -la "$ROOT_MOUNT/dev/vd"* 2>/dev/null || echo "No devices visible"
          
          echo ""
          echo "=========================================="
          echo "/dev bind mounts complete"
          echo "=========================================="
          
          exit 0
      timeout: 30
