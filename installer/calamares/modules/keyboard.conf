---
# Keyboard configuration

# X11 keyboard model
xOrgConfFileName: "/etc/X11/xorg.conf.d/00-keyboard.conf"
xOrgConfOverrides: true

# Console keyboard configuration
convertedKeymapPath: "/lib/kbd/keymaps/converted"
vconsoleConfFileName: "/etc/vconsole.conf"

# Default keyboard settings
defaultLayout: "us"
defaultModel: "pc105"
defaultVariant: ""
defaultOptions: ""

# Available keyboard models
keyboardModels:
    - value: "pc105"
      label: "Generic 105-key PC"
    - value: "pc104"
      label: "Generic 104-key PC"
    - value: "pc86"
      label: "Generic 86-key PC"

# Available keyboard layouts
keyboardLayouts:
    - value: "us"
      label: "English (US)"
    - value: "gb"
      label: "English (UK)"
    - value: "de"
      label: "German"
    - value: "fr"
      label: "French"
    - value: "es"
      label: "Spanish"
    - value: "it"
      label: "Italian"
    - value: "pt"
      label: "Portuguese"
    - value: "ru"
      label: "Russian"
    - value: "jp"
      label: "Japanese"
    - value: "cn"
      label: "Chinese"

# Available keyboard variants
keyboardVariants:
    us:
        - value: ""
          label: "Default"
        - value: "intl"
          label: "International"
        - value: "dvorak"
          label: "Dvorak"
    gb:
        - value: ""
          label: "Default"
        - value: "intl"
          label: "International"
    de:
        - value: ""
          label: "Default"
        - value: "nodeadkeys"
          label: "No dead keys"
    fr:
        - value: ""
          label: "Default"
        - value: "nodeadkeys"
          label: "No dead keys"

# Test keyboard input
testKeyboard: true