---
# Keyboard module configuration

# X11 keyboard model (usually "pc105" for most keyboards)
xOrgLayout: "us"
xOrgModel: "pc105"
xOrgVariant: ""
xOrgOptions: ""

# Convert X11 settings to console settings
convertedKeymapPath: "/etc/default/keyboard"

# Write X11 keyboard configuration
writeEtcDefaultKeyboard: true
