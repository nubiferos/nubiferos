---
# Debug script to verify devices are visible after mount
# Runs in chroot to check if /dev is properly mounted

dontChroot: false

script:
    - command: "/bin/bash"
      args:
        - "-c"
        - |
          echo "=========================================="
          echo "DEBUG: Checking device visibility in chroot"
          echo "=========================================="
          
          echo "Current working directory:"
          pwd
          
          echo ""
          echo "Checking /dev mount:"
          mount | grep /dev || echo "ERROR: /dev not mounted"
          
          echo ""
          echo "Listing /dev:"
          ls -la /dev/sd* /dev/vd* 2>&1 || echo "ERROR: No devices found"
          
          echo ""
          echo "Checking /dev/pts:"
          ls -la /dev/pts 2>&1 || echo "ERROR: /dev/pts not accessible"
          
          echo ""
          echo "Running blkid:"
          blkid 2>&1 || echo "ERROR: blkid failed"
          
          echo ""
          echo "Checking if we're in overlay:"
          df -T / | grep overlay && echo "WARNING: Still in overlay filesystem!" || echo "OK: Not in overlay"
          
          echo ""
          echo "=========================================="
          echo "DEBUG: Device check complete"
          echo "=========================================="
          
          exit 0
      timeout: 30
