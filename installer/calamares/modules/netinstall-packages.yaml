---
# Package groups for netinstall module
# Debian repo packages + external tools (installed via shellprocess)

- name: "Cloud Development Tools"
  description: "Docker, Python cloud SDKs, and AWS CLI"
  selected: true
  critical: false
  packages:
    - docker.io
    - docker-compose
    - python3-boto3
    - python3-azure
    - awscli

- name: "Kubernetes Tools"
  description: "kubectl, Helm, k9s, and eksctl (installed from official sources)"
  selected: true
  critical: false
  expanded: true
  subgroups:
    - name: "kubectl"
      description: "Kubernetes command-line tool"
      selected: true
      packages: []
    - name: "Helm"
      description: "Kubernetes package manager"
      selected: true
      packages: []
    - name: "k9s"
      description: "Terminal UI for Kubernetes"
      selected: true
      packages: []
    - name: "eksctl"
      description: "Amazon EKS cluster management"
      selected: true
      packages: []

- name: "Infrastructure as Code"
  description: "Terraform and Ansible for infrastructure management"
  selected: true
  critical: false
  expanded: true
  subgroups:
    - name: "Terraform"
      description: "Infrastructure provisioning by HashiCorp"
      selected: true
      packages: []
    - name: "Ansible"
      description: "Configuration management and automation"
      selected: true
      packages:
        - ansible

- name: "Development Tools"
  description: "Git, build tools, and development utilities"
  selected: true
  critical: false
  packages:
    - git
    - build-essential
    - python3-dev
    - python3-pip
    - python3-venv
    - nodejs
    - npm
    - curl
    - wget
    - jq

- name: "Terminal Editors"
  description: "Vim, Neovim, Emacs"
  selected: true
  critical: false
  packages:
    - vim
    - neovim
    - emacs-nox

- name: "Security & Hardening"
  description: "Firejail, AppArmor, and security tools (REQUIRED)"
  selected: true
  critical: true
  immutable: true
  packages:
    - firejail
    - apparmor
    - apparmor-utils
    - fail2ban
    - ufw
    - aide
    - rkhunter
    - lynis
