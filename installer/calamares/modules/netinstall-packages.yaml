---
# Package groups for netinstall module
# Only packages available in Debian repos

- name: "Cloud Development Tools"
  description: "Docker, Python cloud SDKs, and development tools"
  selected: true
  critical: false
  packages:
    - docker.io
    - docker-compose
    - python3-boto3
    - python3-azure
    - python3-google-cloud-storage
    - awscli

- name: "Development Tools"
  description: "Git, build tools, and development utilities"
  selected: true
  critical: false
  packages:
    - git
    - build-essential
    - python3-dev
    - python3-pip
    - python3-venv
    - nodejs
    - npm
    - curl
    - wget

- name: "IDEs and Editors"
  description: "Text editors (VS Code, IntelliJ, PyCharm available post-install)"
  selected: false
  critical: false
  packages:
    - vim
    - neovim
    - emacs
    - geany
    - kate

- name: "Security & Hardening"
  description: "Firejail, AppArmor, and security monitoring tools (REQUIRED)"
  selected: true
  critical: true
  immutable: true
  packages:
    - firejail
    - apparmor
    - apparmor-utils
    - fail2ban
    - ufw
    - aide
    - rkhunter
    - lynis
