---
# Package groups for netinstall module
# Packages from Debian repos + post-install scripts for external tools

- name: "Cloud Development Tools"
  description: "Docker, Python cloud SDKs, and AWS/Azure CLIs"
  selected: true
  critical: false
  packages:
    - docker.io
    - docker-compose
    - python3-boto3
    - python3-azure
    - awscli

- name: "Kubernetes Tools"
  description: "kubectl, Helm, and k9s for Kubernetes management"
  selected: true
  critical: false
  subgroups:
    - name: "kubectl"
      description: "Kubernetes command-line tool"
      selected: true
      packages: []
      post-install: /usr/share/nubiferos/installers/install-kubectl.sh
    - name: "Helm"
      description: "Kubernetes package manager"
      selected: true
      packages: []
      post-install: /usr/share/nubiferos/installers/install-helm.sh
    - name: "k9s"
      description: "Terminal UI for Kubernetes"
      selected: true
      packages: []
      post-install: /usr/share/nubiferos/installers/install-k9s.sh

- name: "Infrastructure as Code"
  description: "Terraform and Ansible for infrastructure management"
  selected: true
  critical: false
  subgroups:
    - name: "Terraform"
      description: "Infrastructure provisioning by HashiCorp"
      selected: true
      packages: []
      post-install: /usr/share/nubiferos/installers/install-terraform.sh
    - name: "Ansible"
      description: "Configuration management and automation"
      selected: true
      packages:
        - ansible

- name: "Development Tools"
  description: "Git, build tools, and development utilities"
  selected: true
  critical: false
  packages:
    - git
    - build-essential
    - python3-dev
    - python3-pip
    - python3-venv
    - nodejs
    - npm
    - curl
    - wget
    - jq

- name: "IDEs and Editors"
  description: "Code editors and IDEs"
  selected: false
  critical: false
  subgroups:
    - name: "Terminal Editors"
      description: "Vim, Neovim, Emacs"
      selected: true
      packages:
        - vim
        - neovim
        - emacs-nox
    - name: "VS Code"
      description: "Visual Studio Code (downloads ~100MB)"
      selected: false
      packages: []
      post-install: /usr/share/nubiferos/installers/install-vscode.sh
    - name: "IntelliJ IDEA"
      description: "IntelliJ IDEA Community Edition (downloads ~800MB)"
      selected: false
      packages: []
      post-install: /usr/share/nubiferos/installers/install-intellij.sh
    - name: "PyCharm"
      description: "PyCharm Community Edition (downloads ~500MB)"
      selected: false
      packages: []
      post-install: /usr/share/nubiferos/installers/install-pycharm.sh

- name: "Security & Hardening"
  description: "Firejail, AppArmor, and security monitoring tools (REQUIRED)"
  selected: true
  critical: true
  immutable: true
  subgroups:
    - name: "Sandbox & Isolation"
      description: "Application sandboxing for credential protection"
      selected: true
      critical: true
      packages:
        - firejail
    - name: "Mandatory Access Control"
      description: "AppArmor kernel security - restricts what apps can access"
      selected: true
      critical: true
      packages:
        - apparmor
        - apparmor-utils
    - name: "Intrusion Prevention"
      description: "fail2ban - blocks brute force attacks on SSH/services"
      selected: true
      critical: true
      packages:
        - fail2ban
    - name: "Firewall"
      description: "ufw - deny-by-default firewall, blocks unauthorized access"
      selected: true
      critical: true
      packages:
        - ufw
    - name: "File Integrity Monitoring"
      description: "AIDE - detects unauthorized changes to system files"
      selected: true
      critical: true
      packages:
        - aide
    - name: "Rootkit Detection"
      description: "rkhunter - scans for rootkits and backdoors"
      selected: true
      critical: true
      packages:
        - rkhunter
    - name: "Security Auditing"
      description: "Lynis - comprehensive security audit and hardening tool"
      selected: true
      critical: true
      packages:
        - lynis
