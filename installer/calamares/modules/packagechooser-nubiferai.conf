---
# NubiferAI - Dedicated installer page for the AI assistant framework
#
# This gives NubiferAI its own page in the installer sidebar rather than
# being buried as a checkbox in the netinstall package list.
#
# Uses packagechooser module (Qt Widgets) for reliability.
# Selection is stored in GlobalStorage as "packagechooser_nubiferai".
# The nubiferaimarker Python module reads this and creates a marker file
# for the install-selected-tools.sh script.

mode: optional
method: legacy

labels:
    sidebar: "NubiferAI"
    title: "AI-Powered Cloud Management"

items:
    - id: nubiferai
      name: "Install NubiferAI"
      description: >-
          NubiferAI is an optional AI assistant framework for intelligent
          cloud resource management.


          Key features:

          - Natural language queries across AWS, Azure, and GCP

          - Cost optimization and security recommendations

          - Privacy-first — local LLM support, no data leaves your system

          - Workspace-scoped — AI only accesses permitted workspaces

          - Fully auditable — all AI interactions are logged


          NubiferAI is disabled by default after installation. You choose
          when to enable it and which AI provider to use (Amazon Q, OpenAI,
          Anthropic, or a local model via Ollama).
      screenshot: "/etc/calamares/branding/nubiferos/nubiferai-preview.png"

    - id: ""
      name: "Skip NubiferAI"
      description: >-
          Don't install the AI assistant framework. You can always install
          it later by running: sudo apt install nubiferai
