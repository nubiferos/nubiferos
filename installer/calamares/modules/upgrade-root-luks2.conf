---
# Upgrade root partition from LUKS1 to LUKS2 + Argon2id
# Runs after partition creates LUKS1 volumes, before mount
# Leaves /boot as LUKS1 (GRUB compatible) but upgrades root for max security

dontChroot: true
timeout: 120

script:
    - command: "/usr/local/bin/calamares-upgrade-root-luks2.sh"
      timeout: 120
