# Initramfs configuration for Debian-based systems
# This module configures cryptsetup hooks in initramfs for LUKS decryption

# For Debian/Ubuntu systems using initramfs-tools
# Ensures cryptsetup is included in initramfs to prompt for LUKS passphrase

# The initramfscfg module will:
# 1. Configure /etc/crypttab with LUKS device info
# 2. Ensure cryptsetup hook is enabled in initramfs
# 3. Update initramfs after configuration
