---
backend: apt

operations:
  - install:
    # Kernel and boot essentials
    - linux-image-amd64
    - linux-headers-amd64
    - grub-pc
    - grub-efi-amd64
    - grub-common
    - grub2-common
    - os-prober
    - efibootmgr
    # Base utilities
    - vim
    - curl
    - wget
    - git
    - htop
    - tmux
    - net-tools
    - jq
    - unzip
    - ca-certificates
    # Base development dependencies (always installed for cloud tools)
    - python3
    - python3-pip
    - python3-venv
    - python3-dev
    - nodejs
    - npm
    - build-essential
    - gcc
    - g++
    - make
    # TPM auto-unlock (used if TPM present, harmless if not)
    - tpm2-tools
    - clevis
    - clevis-tpm2
    - clevis-luks
    - clevis-initramfs
  - remove:
    - calamares
    - calamares-settings-debian
  - try_remove:
    - live-boot
    - live-boot-initramfs-tools
    - live-config
    - live-config-systemd
