---
backend: apt

operations:
  - install:
    # Base utilities
    - vim
    - curl
    - wget
    - git
    - htop
    - tmux
    - net-tools
    - jq
    - unzip
    - ca-certificates
    # Base development dependencies (always installed for cloud tools)
    - python3
    - python3-pip
    - python3-venv
    - python3-dev
    - nodejs
    - npm
    - build-essential
    - gcc
    - g++
    - make
  - remove:
    - calamares
    - calamares-settings-debian
  - try_remove:
    - live-boot
    - live-boot-initramfs-tools
    - live-config
    - live-config-systemd
