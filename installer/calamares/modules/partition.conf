---
# NubiferOS Partition Configuration
# LUKS1 /boot (GRUB compatible) + LUKS2 root (GPU-resistant)
# Maximum security setup with Evil Maid protection

efiSystemPartition: "/boot/efi"

userSwapChoices:
    - none
    - small
    - suspend
    - file

drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true

initialPartitioningChoice: erase
initialSwapChoice: small

defaultFileSystemType: "ext4"
defaultPartitionTableType: "gpt"

availableFileSystemTypes:
    - "ext4"
    - "btrfs"
    - "xfs"

# LUKS Encryption Settings
# Start with LUKS1 for GRUB compatibility
# Root will be upgraded to LUKS2 + Argon2id by upgrade-root-luks2 module
enableLuksAutomatedPartitioning: true
preCheckEncryption: true
luksGeneration: luks1

# Custom partition layout with separate encrypted /boot
# ESP: Unencrypted (required for UEFI)
# /boot: LUKS1 encrypted (GRUB decrypts this)
# /: LUKS1 initially, converted to LUKS2 + Argon2id post-partition
partitionLayout:
    - name: "EFI"
      type: "EF00"
      filesystem: "fat32"
      mountPoint: "/boot/efi"
      size: 512MiB
      minSize: 256MiB
      maxSize: 1GiB
    - name: "boot"
      filesystem: "ext4"
      mountPoint: "/boot"
      size: 1GiB
      minSize: 512MiB
      maxSize: 2GiB
      features:
        - luks
    - name: "root"
      filesystem: "ext4"
      mountPoint: "/"
      size: 100%
      minSize: 10GiB
      features:
        - luks
