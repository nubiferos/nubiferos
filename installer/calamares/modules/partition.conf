---
# NubiferOS Partition Configuration
# Option B: LUKS2 + Argon2id with unencrypted /boot for maximum security

# EFI System Partition settings
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 256MiB
    label: "EFI"

userSwapChoices:
    - none
    - small
    - suspend
    - file

drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true

initialPartitioningChoice: erase
initialSwapChoice: small

defaultFileSystemType: "ext4"
defaultPartitionTableType: "gpt"

availableFileSystemTypes:
    - "ext4"
    - "btrfs"
    - "xfs"

# LUKS2 Encryption Settings
# Use LUKS2 with Argon2id (default) for maximum security against GPU attacks
# /boot remains unencrypted so GRUB doesn't need to decrypt anything
# The initramfs handles LUKS2 decryption after kernel loads
enableLuksAutomatedPartitioning: true
preCheckEncryption: true
luksGeneration: luks2

# Don't show warning about unencrypted /boot - this is intentional
# /boot only contains kernel/initramfs (public code), not sensitive data
showNotEncryptedBootMessage: false

# Custom partition layout for LUKS2 compatibility
# ESP + unencrypted /boot + encrypted root
partitionLayout:
    - name: "EFI"
      type: "EF00"
      filesystem: "fat32"
      mountPoint: "/boot/efi"
      size: 512MiB
      minSize: 256MiB
      maxSize: 1GiB
    - name: "boot"
      filesystem: "ext4"
      mountPoint: "/boot"
      size: 1GiB
      minSize: 512MiB
      maxSize: 2GiB
      features:
        - noluks
    - name: "root"
      filesystem: "ext4"
      mountPoint: "/"
      size: 100%
      minSize: 10GiB
      features:
        - luks
