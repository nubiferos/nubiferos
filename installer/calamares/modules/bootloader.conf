---
# GRUB bootloader configuration
efiBootLoader: "grub"
efiBootloaderId: "nubiferos"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

# Install EFI fallback bootloader
installEFIFallback: true

# Kernel command line parameters
kernelLine: ", with Linux"
fallbackKernelLine:  ", with Linux (fallback initramfs)"

# Timeout for bootloader installation (seconds)
timeout: 120

# GRUB installation options
grubInstallOptions:
  - "--target=x86_64-efi"
  - "--efi-directory=/boot/efi"
  - "--bootloader-id=nubiferos"
  - "--recheck"
  - "--no-floppy"

# For BIOS systems
grubPCInstallOptions:
  - "--target=i386-pc"
  - "--recheck"
  - "--no-floppy"
  - "--force"

# Don't chroot for bootloader installation
# Set to false to run grub-install in the target system
dontChroot: false

# Skip bootloader installation on failure (for encrypted systems)
# This prevents installation failure due to GRUB/LUKS issues
skipBootloaderOnFailure: true

# Additional GRUB configuration for encrypted systems
grubCfgOptions:
  - "GRUB_ENABLE_CRYPTODISK=y"
  - "GRUB_CMDLINE_LINUX_DEFAULT=\"quiet splash\""
