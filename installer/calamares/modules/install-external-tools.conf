# Install external tools that aren't in Debian repos
# Runs after packages module to install kubectl, helm, k9s, terraform, etc.
# These tools are downloaded from official sources during installation
#
# The master installer script checks for marker files to determine
# which tools to install based on user selection in netinstall.

---
dontChroot: false
timeout: 1800  # 30 minutes for all external tools

script:
    # Master installer handles all external tools
    - command: "/usr/share/nubiferos/installers/install-selected-tools.sh"
      timeout: 1800
