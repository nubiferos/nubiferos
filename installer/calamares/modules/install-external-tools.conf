# Install external tools that aren't in Debian repos
# Runs after packages module to install kubectl, helm, k9s, terraform, etc.
# These tools are downloaded from official sources

---
dontChroot: false
timeout: 600

script:
    # Install kubectl if selected (check for marker file or always install)
    - command: "/usr/share/nubiferos/installers/install-kubectl.sh"
      timeout: 120
    # Install Helm
    - command: "/usr/share/nubiferos/installers/install-helm.sh"
      timeout: 120
    # Install k9s
    - command: "/usr/share/nubiferos/installers/install-k9s.sh"
      timeout: 120
    # Install Terraform
    - command: "/usr/share/nubiferos/installers/install-terraform.sh"
      timeout: 120
    # Install eksctl
    - command: "/usr/share/nubiferos/installers/install-eksctl.sh"
      timeout: 120
