---
# Custom bootloader configuration for LUKS encrypted systems
# This handles the GRUB + LUKS mapping issue

# Use custom bootloader script
bootloaderEntryName: "NubiferOS"
grubInstall: "/usr/local/bin/grub-install-luks-wrapper"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"

# Timeout for bootloader installation
timeout: 180

# GRUB installation options for encrypted systems
grubInstallOptions:
  - "--target=x86_64-efi"
  - "--efi-directory=/boot/efi"
  - "--bootloader-id=nubiferos"
  - "--recheck"
  - "--no-floppy"

# For BIOS systems with encryption support
grubPCInstallOptions:
  - "--target=i386-pc"
  - "--recheck"
  - "--no-floppy"
  - "--force"

# Run in chroot to access proper device mappings
dontChroot: false

# Enable cryptodisk support
grubCfgOptions:
  - "GRUB_ENABLE_CRYPTODISK=y"
  - "GRUB_CMDLINE_LINUX_DEFAULT=\"quiet splash\""
  - "GRUB_PRELOAD_MODULES=\"luks cryptodisk\""

# Skip on failure to prevent installation abort
skipBootloaderOnFailure: true