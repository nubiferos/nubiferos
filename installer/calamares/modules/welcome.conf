---
# Welcome module configuration

showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    true

# Hide the "Quit" button - we want users to install, not quit to live environment
showDonateUrl:          false

# Custom welcome text (overrides default "or continue using the live system")
# Note: The actual text is controlled by Calamares translations, but we can
# influence behavior by not providing a quit option

requirements:
    requiredStorage:    10.0
    requiredRam:        2.0
    internetCheckUrl:   http://google.com
    check:
        - storage
        - ram
    required:
        - storage
        - ram
