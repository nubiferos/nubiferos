# Calamares settings for NubiferOS

---
modules-search: [ local ]

instances:
- id:       nubiferos
  module:   packages
  config:   packages.conf
- id:       prepare-bootloader
  module:   shellprocess
  config:   prepare-bootloader.conf
- id:       prepare-devices
  module:   shellprocess
  config:   prepare-devices.conf
- id:       debug-devices
  module:   shellprocess
  config:   debug-devices.conf
- id:       fix-dev-mounts
  module:   shellprocess
  config:   fix-dev-mounts.conf
- id:       setup-encryption-nag
  module:   shellprocess
  config:   setup-encryption-nag.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - notesqml     # Encryption warning - reminds user to enable encryption
  - users
  - netinstall  # Using netinstall instead of packagechooser (no QML, no segfault)
  - summary
- exec:
  - shellprocess@prepare-devices
  - partition
  - mount
  - unpackfs
  - shellprocess@fix-dev-mounts
  - shellprocess@debug-devices
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - packages@nubiferos
  - shellprocess@setup-encryption-nag
  - shellprocess@prepare-bootloader
  - shellprocess@log-bootloader-config
  - bootloader
  - umount
- show:
  - finished

# Testing minimal nubiferos branding
branding: nubiferos

prompt-install: true

dont-chroot: false

oem-setup: false

disable-cancel: false

disable-cancel-during-exec: true

hide-back-and-next-during-exec: true

quit-at-end: false
