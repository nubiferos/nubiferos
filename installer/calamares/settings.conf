# Calamares settings for NubiferOS

---
modules-search: [ local ]

instances:
- id:       nubiferos
  module:   packages
  config:   packages.conf
- id:       prepare-bootloader
  module:   shellprocess
  config:   prepare-bootloader.conf
- id:       prepare-devices
  module:   shellprocess
  config:   prepare-devices.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - netinstall  # Using netinstall instead of packagechooser (no QML, no segfault)
  - summary
- exec:
  - shellprocess@prepare-devices
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - packages@nubiferos
  - shellprocess@prepare-bootloader
  - bootloader
  - umount
- show:
  - finished

# Testing minimal nubiferos branding
branding: nubiferos

prompt-install: true

dont-chroot: false

oem-setup: false

disable-cancel: false

disable-cancel-during-exec: true

hide-back-and-next-during-exec: true

quit-at-end: false
