# Calamares configuration for test mode module

---
# Show test mode option in installer
showTestMode: true

# Default state (unchecked by default)
defaultEnabled: false

# Description shown to user
description: |
    Enable post-installation testing mode.
    
    When enabled, the system will automatically run comprehensive tests
    after installation completes and on first boot. This verifies:
    
    • All packages are installed correctly
    • Browser bookmarks are configured
    • Credential management works
    • IDE plugins can be installed
    • Update checker functions
    • Security settings are applied
    
    Test results will be saved to /var/log/nubifer-test-report.txt
    
    Recommended for:
    • Quality assurance testing
    • Automated deployments
    • CI/CD pipelines
    • Verifying custom builds
