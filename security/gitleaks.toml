# NubiferOS Gitleaks Configuration
# Custom rules for secret detection
#
# See: https://github.com/gitleaks/gitleaks#configuration

title = "NubiferOS Secret Detection Rules"

[extend]
useDefault = true

# NubiferOS-specific rules
[[rules]]
id = "nubifer-credential-path"
description = "NubiferOS credential path exposure in code"
regex = '''nubifer/[a-zA-Z0-9_-]+/cloud/(aws|azure|gcp)/[a-zA-Z0-9_-]+/'''
keywords = ["nubifer"]
tags = ["nubiferos", "credential-path"]

[[rules]]
id = "aws-credential-export"
description = "AWS credentials exported to environment (violates NubiferOS security rules)"
regex = '''export\s+(AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|AWS_SESSION_TOKEN)\s*='''
keywords = ["export", "AWS"]
tags = ["aws", "environment-variable", "security-violation"]

[[rules]]
id = "azure-credential-export"
description = "Azure credentials exported to environment"
regex = '''export\s+(AZURE_CLIENT_SECRET|AZURE_TENANT_ID|AZURE_CLIENT_ID)\s*='''
keywords = ["export", "AZURE"]
tags = ["azure", "environment-variable"]

[[rules]]
id = "gcp-credential-export"
description = "GCP credentials exported to environment"
regex = '''export\s+(GOOGLE_APPLICATION_CREDENTIALS|GOOGLE_CLOUD_PROJECT)\s*='''
keywords = ["export", "GOOGLE"]
tags = ["gcp", "environment-variable"]

[[rules]]
id = "pass-store-path"
description = "Password store path that might contain secrets"
regex = '''pass\s+(show|insert|edit)\s+[^\s]+/(secret|password|key|token)'''
keywords = ["pass"]
tags = ["password-store"]

# Allowlist paths that are expected to contain example/test content
[allowlist]
description = "Global allowlist"
paths = [
  '''.*\.md$''',
  '''.*\.txt$''',
  '''test.*''',
  '''example.*''',
  '''mock.*''',
  '''fixture.*''',
  '''docs/.*''',
  '''\.kiro/.*''',
  # AWS CLI bundled data files - contain example IPs and API field names
  '''components/workspace-manager/aws/.*''',
  # Dev scripts with internal IPs
  '''dev/.*''',
  # Credential manager code - stores TO pass, doesn't export secrets
  '''components/credential-manager/nubifer-creds''',
  # Setup wizard - contains credential path patterns, not actual secrets
  '''scripts/nubifer-setup-wizard''',
  # Cleanup script - help text showing what NOT to do
  '''scripts/cleanup-s3-checksums\.sh''',
]

# Allowlist specific patterns that are false positives
regexes = [
  '''EXAMPLE_.*''',
  '''PLACEHOLDER_.*''',
  '''YOUR_.*_HERE''',
  '''<.*>''',
  '''\$\{.*\}''',
  # Help text showing what NOT to do
  '''echo.*export\s+AWS''',
  # Python code that stores credentials TO pass (not exports)
  '''pass insert.*''',
  '''subprocess\.run\(\[.pass.''',
]

# Allowlist specific commits (add commit SHAs here for known false positives)
commits = []
