<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- AWS Orange gradient -->
    <linearGradient id="awsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#232f3e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1f2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1419;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="awsAccent" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ff9900;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ff9900;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#awsGradient)"/>
  
  <!-- AWS Orange accents -->
  <ellipse cx="400" cy="300" rx="500" ry="400" fill="url(#awsAccent)"/>
  <ellipse cx="1520" cy="780" rx="500" ry="400" fill="url(#awsAccent)"/>
  
  <!-- Subtle grid -->
  <defs>
    <pattern id="awsGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ff9900" stroke-width="0.5" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#awsGrid)"/>
  
  <!-- AWS Cloud icon -->
  <g transform="translate(960, 540)">
    <path d="M -80 20 Q -100 0 -100 -30 Q -100 -60 -80 -80 Q -60 -100 -30 -100 Q -20 -120 0 -120 Q 20 -120 30 -100 Q 60 -100 80 -80 Q 100 -60 100 -30 Q 100 0 80 20 Z" 
          fill="#ff9900" 
          opacity="0.2"
          stroke="#ff9900" 
          stroke-width="2"
          opacity="0.4"/>
  </g>
  
  <!-- Text -->
  <text x="960" y="680" 
        font-family="'Amazon Ember', 'Segoe UI', Arial, sans-serif" 
        font-size="72" 
        font-weight="300" 
        fill="#ff9900" 
        text-anchor="middle"
        opacity="0.6">AWS Workspace</text>
  
  <text x="960" y="730" 
        font-family="'Amazon Ember', 'Segoe UI', Arial, sans-serif" 
        font-size="28" 
        fill="#879196" 
        text-anchor="middle"
        opacity="0.4">Amazon Web Services</text>
</svg>
