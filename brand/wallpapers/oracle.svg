<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Oracle Red gradient -->
    <linearGradient id="oracleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0000;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#330000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4d0000;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="oracleAccent" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ff0000;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ff0000;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#oracleGradient)"/>
  
  <!-- Oracle Red accents -->
  <ellipse cx="350" cy="280" rx="500" ry="400" fill="url(#oracleAccent)"/>
  <ellipse cx="1570" cy="800" rx="500" ry="400" fill="url(#oracleAccent)"/>
  
  <!-- Subtle grid -->
  <defs>
    <pattern id="oracleGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ff0000" stroke-width="0.5" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#oracleGrid)"/>
  
  <!-- Oracle Cloud icon -->
  <g transform="translate(960, 540)">
    <path d="M -80 20 Q -100 0 -100 -30 Q -100 -60 -80 -80 Q -60 -100 -30 -100 Q -20 -120 0 -120 Q 20 -120 30 -100 Q 60 -100 80 -80 Q 100 -60 100 -30 Q 100 0 80 20 Z" 
          fill="#ff0000" 
          opacity="0.25"
          stroke="#ff0000" 
          stroke-width="2"
          opacity="0.5"/>
  </g>
  
  <!-- Text -->
  <text x="960" y="680" 
        font-family="'Segoe UI', Arial, sans-serif" 
        font-size="72" 
        font-weight="300" 
        fill="#ff0000" 
        text-anchor="middle"
        opacity="0.7">Oracle Workspace</text>
  
  <text x="960" y="730" 
        font-family="'Segoe UI', Arial, sans-serif" 
        font-size="28" 
        fill="#ff6666" 
        text-anchor="middle"
        opacity="0.5">Oracle Cloud Infrastructure</text>
</svg>
