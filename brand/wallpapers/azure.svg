<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Azure Blue gradient -->
    <linearGradient id="azureGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#001f3f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#003d7a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0078d4;stop-opacity:0.3" />
    </linearGradient>
    
    <radialGradient id="azureAccent" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#0078d4;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#0078d4;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#azureGradient)"/>
  
  <!-- Azure Blue accents -->
  <ellipse cx="300" cy="250" rx="500" ry="400" fill="url(#azureAccent)"/>
  <ellipse cx="1620" cy="830" rx="500" ry="400" fill="url(#azureAccent)"/>
  
  <!-- Subtle grid -->
  <defs>
    <pattern id="azureGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0078d4" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#azureGrid)"/>
  
  <!-- Azure Cloud icon -->
  <g transform="translate(960, 540)">
    <path d="M -80 20 Q -100 0 -100 -30 Q -100 -60 -80 -80 Q -60 -100 -30 -100 Q -20 -120 0 -120 Q 20 -120 30 -100 Q 60 -100 80 -80 Q 100 -60 100 -30 Q 100 0 80 20 Z" 
          fill="#0078d4" 
          opacity="0.3"
          stroke="#50e6ff" 
          stroke-width="2"
          opacity="0.5"/>
  </g>
  
  <!-- Text -->
  <text x="960" y="680" 
        font-family="'Segoe UI', Arial, sans-serif" 
        font-size="72" 
        font-weight="300" 
        fill="#0078d4" 
        text-anchor="middle"
        opacity="0.8">Azure Workspace</text>
  
  <text x="960" y="730" 
        font-family="'Segoe UI', Arial, sans-serif" 
        font-size="28" 
        fill="#50e6ff" 
        text-anchor="middle"
        opacity="0.5">Microsoft Azure</text>
</svg>
