<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- GCP Multi-color gradient -->
    <linearGradient id="gcpGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    
    <!-- Google color accents -->
    <radialGradient id="blueAccent" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#4285f4;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#4285f4;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="redAccent" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ea4335;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ea4335;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="yellowAccent" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#fbbc04;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#fbbc04;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="greenAccent" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#34a853;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#34a853;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#gcpGradient)"/>
  
  <!-- Google color accents (4 corners) -->
  <ellipse cx="200" cy="200" rx="400" ry="300" fill="url(#blueAccent)"/>
  <ellipse cx="1720" cy="200" rx="400" ry="300" fill="url(#redAccent)"/>
  <ellipse cx="200" cy="880" rx="400" ry="300" fill="url(#yellowAccent)"/>
  <ellipse cx="1720" cy="880" rx="400" ry="300" fill="url(#greenAccent)"/>
  
  <!-- Subtle grid -->
  <defs>
    <pattern id="gcpGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#4285f4" stroke-width="0.5" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#gcpGrid)"/>
  
  <!-- GCP Cloud icon with Google colors -->
  <g transform="translate(960, 540)">
    <!-- Cloud with 4-color segments -->
    <path d="M -80 20 Q -100 0 -100 -30 Q -100 -60 -80 -80" 
          fill="none" stroke="#4285f4" stroke-width="4" opacity="0.6"/>
    <path d="M -80 -80 Q -60 -100 -30 -100 Q -20 -120 0 -120" 
          fill="none" stroke="#ea4335" stroke-width="4" opacity="0.6"/>
    <path d="M 0 -120 Q 20 -120 30 -100 Q 60 -100 80 -80" 
          fill="none" stroke="#fbbc04" stroke-width="4" opacity="0.6"/>
    <path d="M 80 -80 Q 100 -60 100 -30 Q 100 0 80 20 L -80 20" 
          fill="none" stroke="#34a853" stroke-width="4" opacity="0.6"/>
  </g>
  
  <!-- Text -->
  <text x="960" y="680" 
        font-family="'Google Sans', 'Segoe UI', Arial, sans-serif" 
        font-size="72" 
        font-weight="300" 
        fill="#4285f4" 
        text-anchor="middle"
        opacity="0.7">GCP Workspace</text>
  
  <text x="960" y="730" 
        font-family="'Google Sans', 'Segoe UI', Arial, sans-serif" 
        font-size="28" 
        fill="#8ab4f8" 
        text-anchor="middle"
        opacity="0.5">Google Cloud Platform</text>
</svg>
