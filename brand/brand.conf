# NubiferOS Brand Configuration
# This file contains all branding variables used throughout the project
# Update these values to rebrand the entire distribution

# Core Brand Identity
BRAND_NAME="NubiferOS"
BRAND_SHORT_NAME="Nubifer"
BRAND_CLI_NAME="nubifer"
BRAND_TAGLINE="Multi-Cloud, Unified Control"

# Version Information
BRAND_VERSION="1.0"
BRAND_CODENAME="Nimbus"  # First release codename

# Domain and Web
BRAND_DOMAIN="nubiferos.org"
BRAND_WEBSITE="https://nubiferos.org"
BRAND_DOCS_URL="https://docs.nubiferos.org"
BRAND_REPO_URL="https://github.com/nubiferos/nubiferos"

# Contact and Social
BRAND_EMAIL="info@nubiferos.org"
BRAND_SUPPORT_EMAIL="support@nubiferos.org"
BRAND_TWITTER="@nubiferos"
BRAND_DISCORD="https://discord.gg/nubiferos"

# Legal
BRAND_COPYRIGHT="Copyright © 2024 NubiferOS Project"
BRAND_LICENSE="GPL-3.0"
BRAND_TRADEMARK="NubiferOS™"

# Visual Identity
BRAND_PRIMARY_COLOR="#1E3A8A"      # Deep Blue
BRAND_SECONDARY_COLOR="#94A3B8"    # Silver/Gray
BRAND_ACCENT_COLOR="#F59E0B"       # Gold (for security indicators)
BRAND_AWS_COLOR="#FF9900"          # AWS Orange
BRAND_AZURE_COLOR="#0078D4"        # Azure Blue
BRAND_GCP_COLOR="#EA4335"          # GCP Red

# File Paths
BRAND_LOGO_PATH="/usr/share/${BRAND_CLI_NAME}/branding/logo.png"
BRAND_ICON_PATH="/usr/share/${BRAND_CLI_NAME}/branding/icon.svg"
BRAND_WALLPAPER_PATH="/usr/share/${BRAND_CLI_NAME}/wallpapers"

# Package Naming
BRAND_PACKAGE_PREFIX="${BRAND_CLI_NAME}"
BRAND_SERVICE_PREFIX="${BRAND_CLI_NAME}"

# D-Bus Namespace
BRAND_DBUS_NAMESPACE="org.${BRAND_CLI_NAME}"

# System Paths
BRAND_CONFIG_DIR="/etc/${BRAND_CLI_NAME}"
BRAND_DATA_DIR="/usr/share/${BRAND_CLI_NAME}"
BRAND_LIB_DIR="/usr/lib/${BRAND_CLI_NAME}"
BRAND_LOG_DIR="/var/log/${BRAND_CLI_NAME}"
BRAND_CACHE_DIR="/var/cache/${BRAND_CLI_NAME}"

# User Paths
BRAND_USER_CONFIG_DIR="~/.config/${BRAND_CLI_NAME}"
BRAND_USER_DATA_DIR="~/.local/share/${BRAND_CLI_NAME}"
BRAND_USER_CACHE_DIR="~/.cache/${BRAND_CLI_NAME}"

# ISO Naming
BRAND_ISO_NAME="${BRAND_NAME}-${BRAND_VERSION}"
BRAND_ISO_LABEL="${BRAND_SHORT_NAME}"

# Desktop Environment
BRAND_DESKTOP_NAME="${BRAND_NAME} Desktop"
BRAND_SESSION_NAME="${BRAND_CLI_NAME}"

# Component Names
BRAND_CREDENTIAL_MANAGER="${BRAND_CLI_NAME}-credential-manager"
BRAND_CONTEXT_MANAGER="${BRAND_CLI_NAME}-context-manager"
BRAND_RESOURCE_VIEWER="${BRAND_NAME} Resource Viewer"
BRAND_CONTEXT_INDICATOR="${BRAND_NAME} Context Indicator"

# Messaging
BRAND_WELCOME_MESSAGE="Welcome to ${BRAND_NAME} - ${BRAND_TAGLINE}"
BRAND_BOOT_MESSAGE="Starting ${BRAND_NAME}..."
BRAND_SHUTDOWN_MESSAGE="Shutting down ${BRAND_NAME}..."
