# Systemd tmpfiles configuration
# Ensures XDG_RUNTIME_DIR exists for root and live users
# This prevents Qt applications (like Calamares) from crashing

# Create /run/user/0 for root with proper permissions
d /run/user/0 0700 root root -

# Create /run/user/1000 for live user with proper permissions
d /run/user/1000 0700 live live -
