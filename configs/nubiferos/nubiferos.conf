# NubiferOS System Configuration
# /etc/nubiferos/nubiferos.conf

# Version information (placeholder stamped at build time from the VERSION file)
VERSION="@VERSION@"
CODENAME="Nimbus"

# Default settings
DEFAULT_PROVIDER="aws"
DEFAULT_REGION="us-east-1"

# Security settings
REQUIRE_ENCRYPTION=true
ENABLE_FIREJAIL=false  # User can enable via nubifer-workspace --enable-firejail

# Shell integration
ENABLE_PROMPT_INTEGRATION=true
ENABLE_WORKSPACE_COLORS=true

# Credential manager settings
CREDENTIAL_BACKEND="pass"
CREDENTIAL_TIMEOUT=3600  # seconds before re-authentication required

# Workspace settings
MAX_WORKSPACES=50
WORKSPACE_DATA_DIR="${HOME}/.local/share/nubifer/workspaces"

# Logging
LOG_LEVEL="INFO"
LOG_DIR="/var/log/nubifer"
