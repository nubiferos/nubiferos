# CLI configuration
CLOUDSDK_CORE_DISABLE_PROMPTS="1"

# Color theme for workspace indicator
PROVIDER_COLOR="#4285F4"
PROVIDER_NAME="GCP"
PROVIDER_ICON="gcp"
