# AWS Provider Configuration
# /etc/nubiferos/providers/aws.conf

# Default AWS settings
AWS_DEFAULT_REGION="us-east-1"
AWS_DEFAULT_OUTPUT="json"

# CLI configuration
AWS_PAGER=""  # Disable pager for scripting

# Security settings
AWS_METADATA_SERVICE_TIMEOUT=1
AWS_METADATA_SERVICE_NUM_ATTEMPTS=1

# Color theme for workspace indicator
PROVIDER_COLOR="#FF9900"
PROVIDER_NAME="AWS"
PROVIDER_ICON="aws"
