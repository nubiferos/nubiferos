name: Security Scan

on:
  push:
    branches: [trunk, main]
  pull_request:
    branches: [trunk, main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6am UTC

permissions:
  contents: read
  security-events: write

jobs:
  code-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Run gitleaks (secret detection)
      uses: gitleaks/gitleaks-action@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
      
    - name: Install shellcheck
      run: sudo apt-get install -y shellcheck
      
    - name: Run shellcheck on scripts
      run: |
        echo "=========================================="
        echo "Running ShellCheck on shell scripts"
        echo "=========================================="
        
        ERRORS=0
        WARNINGS=0
        
        # Find all shell scripts
        find . -name "*.sh" -type f ! -path "./.git/*" ! -path "./work/*" ! -path "./output/*" | while read script; do
          echo "Checking: $script"
          if ! shellcheck -S warning "$script" 2>/dev/null; then
            ((WARNINGS++)) || true
          fi
        done
        
        echo ""
        echo "ShellCheck complete"
        
    - name: Check for hardcoded credentials patterns
      run: |
        echo "=========================================="
        echo "Checking for credential patterns"
        echo "=========================================="
        
        # Patterns that should NOT appear in code
        PATTERNS=(
          'AKIA[0-9A-Z]{16}'                    # AWS Access Key
          'aws_secret_access_key\s*=\s*[^$]'   # Hardcoded AWS secret
          'password\s*=\s*["\x27][^$\{]'       # Hardcoded password
          'BEGIN RSA PRIVATE KEY'              # Private key
          'BEGIN OPENSSH PRIVATE KEY'          # SSH private key
        )
        
        FOUND=0
        for pattern in "${PATTERNS[@]}"; do
          if grep -rE "$pattern" --include="*.py" --include="*.sh" --include="*.yaml" --include="*.yml" --include="*.conf" . 2>/dev/null | grep -v "example" | grep -v "placeholder" | grep -v "test" | head -5; then
            echo "⚠️  Found potential credential pattern: $pattern"
            FOUND=1
          fi
        done
        
        if [ $FOUND -eq 0 ]; then
          echo "✓ No hardcoded credentials detected"
        fi

  build-log-analysis:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Analyze recent build logs
      run: |
        echo "=========================================="
        echo "Build Log Warning Patterns"
        echo "=========================================="
        echo ""
        echo "Known warnings to monitor in build logs:"
        echo ""
        echo "1. EXPECTED (harmless in chroot):"
        echo "   - 'cannot open /proc/mounts' - chroot has no /proc"
        echo "   - 'Couldn't determine root device' - no real root in chroot"
        echo "   - 'can't read /proc/cmdline' - no kernel cmdline in chroot"
        echo "   - '/proc/cpuinfo: No such file' - no CPU info in chroot"
        echo ""
        echo "2. INVESTIGATE if seen:"
        echo "   - 'E: Unable to locate package' - missing dependency"
        echo "   - 'dpkg: error' - package installation failure"
        echo "   - 'Permission denied' - file permission issues"
        echo "   - 'No space left on device' - disk space exhausted"
        echo "   - 'Segmentation fault' - crash during build"
        echo ""
        echo "3. CRITICAL (should fail build):"
        echo "   - 'FATAL:' - critical error"
        echo "   - 'kernel panic' - boot failure"
        echo "   - 'grub-install: error' - bootloader failure"
        echo ""
        
        # Check if we have local logs to analyze
        if [ -d "logs" ]; then
          echo "Analyzing local build logs..."
          
          # Count warning types
          echo ""
          echo "Warning counts in recent logs:"
          grep -rh "WARNING" logs/*.log 2>/dev/null | sort | uniq -c | sort -rn | head -20 || echo "No warnings found"
          
          echo ""
          echo "Error counts in recent logs:"
          grep -rh "ERROR\|FATAL\|error:" logs/*.log 2>/dev/null | sort | uniq -c | sort -rn | head -20 || echo "No errors found"
        else
          echo "No local logs directory found"
        fi
