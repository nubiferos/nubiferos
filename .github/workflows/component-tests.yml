name: Component Tests

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

permissions:
  contents: read

jobs:
  component-tests:
    name: Python components & shell syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # matches Debian bookworm target

      - name: Byte-compile all Python components
        run: |
          # Compile every tracked .py plus extensionless Python executables
          FAIL=0
          while IFS= read -r f; do
            python3 -m py_compile "$f" || { echo "COMPILE FAIL: $f"; FAIL=1; }
          done < <(git ls-files 'components/**/*.py' 'scripts/*.py')
          for exe in components/credential-manager/nubifer-creds \
                     components/credential-manager/nubifer-aws-credential-helper \
                     components/workspace-manager/nubifer-workspace \
                     components/security-dashboard/nubifer-dashboard \
                     components/resource-viewer/src/nubifer-resources; do
            [ -f "$exe" ] && { python3 -m py_compile "$exe" || { echo "COMPILE FAIL: $exe"; FAIL=1; }; }
          done
          exit $FAIL

      - name: Component unit tests (stdlib unittest)
        run: |
          # Discover and run every stdlib unittest suite under components/*/tests.
          # All suites are offline and dependency-free (stdlib only, no pip installs).
          # Skipped: components whose tests need third-party frameworks.
          #   - nubifer-cli: pytest/typer/hypothesis suite, not stdlib-runnable
          SKIP="components/nubifer-cli"
          FAIL=0
          RAN=0
          for tests_dir in components/*/tests; do
            [ -d "$tests_dir" ] || continue
            comp="${tests_dir%/tests}"
            skipped=0
            for s in $SKIP; do
              [ "$comp" = "$s" ] && skipped=1
            done
            if [ "$skipped" = "1" ]; then
              echo "SKIP: $comp (non-stdlib test dependencies)"
              continue
            fi
            echo "::group::$comp unit tests"
            if (cd "$comp" && python3 -m unittest discover -s tests -v); then
              RESULT="PASS"
            else
              RESULT="FAIL"
              FAIL=1
            fi
            echo "::endgroup::"
            echo "$RESULT: $comp"
            RAN=$((RAN + 1))
          done
          # Guard against silently running nothing (e.g. glob/layout change)
          if [ "$RAN" -eq 0 ]; then
            echo "ERROR: no component test suites were discovered"
            exit 1
          fi
          exit $FAIL

      - name: Shell syntax check (build + scripts + component installers)
        run: |
          FAIL=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "SYNTAX FAIL: $f"; FAIL=1; }
          done < <(git ls-files 'build/*.sh' 'scripts/*.sh' 'components/**/*.sh' 'testing/*.sh')
          exit $FAIL

      - name: Validate desktop entries
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq desktop-file-utils
          FAIL=0
          while IFS= read -r f; do
            desktop-file-validate "$f" || { echo "INVALID: $f"; FAIL=1; }
          done < <(git ls-files 'components/**/*.desktop')
          exit $FAIL
