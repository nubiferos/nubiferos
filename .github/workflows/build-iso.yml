name: Build NubiferOS ISO

# ISO build policy (July 2026): pushes NEVER trigger ISO builds — they only
# run the fast workflows (Security Scan, Component Tests, packages). ISOs
# come from (a) manual dispatch when you want one, or (b) the nightly cron,
# which the guard job skips unless commits landed in the last 25 hours.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'   # nightly 06:00 UTC

# Never two ISO builds at once: an in-progress build is never cancelled,
# and pile-ups collapse to a single queued run
concurrency:
  group: build-iso
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write

env:
  ISO_BUCKET: nubiferos-iso
  AWS_REGION: us-east-1

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Decide whether to build
      id: check
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "should_build=true" >> $GITHUB_OUTPUT
          echo "Manual dispatch — building."
        elif [ -n "$(git log -1 --since='25 hours ago' --oneline)" ]; then
          echo "should_build=true" >> $GITHUB_OUTPUT
          echo "Commits landed in the last 25h — building nightly ISO."
        else
          echo "should_build=false" >> $GITHUB_OUTPUT
          echo "No new commits since the last nightly window — skipping."
        fi

  build-iso:
    needs: guard
    if: needs.guard.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      iso_name: ${{ steps.version.outputs.iso_name }}
      iso_size: ${{ steps.iso_info.outputs.iso_size }}
      commit_sha: ${{ steps.version.outputs.commit_sha }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Free up disk space
      run: |
        echo "Disk space before cleanup:"
        df -h
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        echo "Disk space after cleanup:"
        df -h

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          debootstrap squashfs-tools xorriso isolinux syslinux-efi \
          grub-pc-bin grub-efi-amd64-bin mtools dosfstools wget curl \
          git genisoimage gnupg

    - name: Install security scanning tools
      run: |
        curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin
        curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sudo sh -s -- -b /usr/local/bin

    - name: Set up build environment
      id: version
      run: |
        sudo mkdir -p /var/cache/apt/archives
        mkdir -p output output/debs
        VERSION=$(cat VERSION 2>/dev/null | tr -d '\n')
        if [ -z "$VERSION" ]; then
          VERSION=$(grep 'BRAND_VERSION=' brand/brand.conf | cut -d'"' -f2)
        fi
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        COMMIT_SHA=$(git rev-parse --short HEAD)
        ISO_NAME="nubiferos-${VERSION}-${TIMESTAMP}-${COMMIT_SHA}-amd64.iso"

        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "ISO_NAME=$ISO_NAME" >> $GITHUB_ENV
        echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV

        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "iso_name=$ISO_NAME" >> $GITHUB_OUTPUT
        echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT

    # NOTE: setup-calamares-minimal.sh must NOT run here — it overwrites the
    # curated installer/calamares/ configs in the checkout with stale minimal
    # versions (dropped TPM packages, weakened users.conf, hardcoded 1.0
    # branding). The repo configs are the source of truth.
    - name: Make build scripts executable
      run: chmod +x build/*.sh

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Test S3 connectivity
      run: |
        echo "Testing S3 access..."
        if ! aws s3 ls s3://${{ env.ISO_BUCKET }}/ 2>&1; then
          echo "❌ Cannot access bucket: ${{ env.ISO_BUCKET }}"
          exit 1
        fi
        echo "✓ Bucket accessible"

    - name: Build .deb packages
      run: |
        chmod +x build/build-debs.sh
        bash build/build-debs.sh "${{ env.VERSION }}"
        echo "✓ Built $(ls output/debs/*.deb 2>/dev/null | wc -l) .deb packages"

    - name: Build ISO
      run: |
        export NON_INTERACTIVE=true
        sudo -E bash -x ./build-nubiferos.sh 2>&1 | tee build.log || {
          echo "BUILD FAILED!"
          tail -n 200 build.log
          exit 1
        }

    - name: Verify build output
      run: |
        ls -la output/ || exit 1
        [ -f output/*.iso ] || { echo "No ISO found!"; exit 1; }

    - name: Generate checksums
      run: |
        sudo chown -R $USER:$USER output/
        cd output
        sha256sum *.iso > SHA256SUMS
        md5sum *.iso > MD5SUMS
        cat SHA256SUMS

    - name: Generate SBOM
      run: |
        ISO_FILE=$(ls output/*.iso | head -1)
        sudo mkdir -p /mnt/iso /mnt/squashfs
        sudo mount -o loop "$ISO_FILE" /mnt/iso

        if [ -f /mnt/iso/live/filesystem.squashfs ]; then
          sudo mount -o loop /mnt/iso/live/filesystem.squashfs /mnt/squashfs
          SCAN_PATH="/mnt/squashfs"
        else
          SCAN_PATH="/mnt/iso"
        fi

        sudo syft dir:$SCAN_PATH -o cyclonedx-json > output/sbom-cyclonedx.json 2>/dev/null || true
        sudo syft dir:$SCAN_PATH -o spdx-json > output/sbom-spdx.json 2>/dev/null || true

        sudo umount /mnt/squashfs 2>/dev/null || true
        sudo umount /mnt/iso 2>/dev/null || true

    - name: Run vulnerability scan
      continue-on-error: true
      run: |
        if [ -f output/sbom-cyclonedx.json ] && [ -s output/sbom-cyclonedx.json ]; then
          grype sbom:output/sbom-cyclonedx.json -o json > output/vuln-report.json 2>/dev/null || true
          grype sbom:output/sbom-cyclonedx.json -o table > output/vuln-report.txt 2>/dev/null || true
        fi

        if [ -f output/vuln-report.json ]; then
          CRITICAL=$(jq '[.matches[] | select(.vulnerability.severity == "Critical")] | length' output/vuln-report.json 2>/dev/null || echo "0")
          HIGH=$(jq '[.matches[] | select(.vulnerability.severity == "High")] | length' output/vuln-report.json 2>/dev/null || echo "0")
          echo "Vulnerabilities - Critical: $CRITICAL, High: $HIGH"
          echo "VULN_CRITICAL=$CRITICAL" >> $GITHUB_ENV
          echo "VULN_HIGH=$HIGH" >> $GITHUB_ENV
        fi

    - name: Sign ISO
      continue-on-error: true
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        if [ -z "$GPG_PRIVATE_KEY" ]; then
          echo "GPG key not configured - skipping signing"
          exit 0
        fi

        export GNUPGHOME=$(mktemp -d -t gpg-signing-XXXXXX)
        chmod 700 "$GNUPGHOME"

        echo "$GPG_PRIVATE_KEY" | gpg --batch --import 2>&1 || exit 0
        KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | grep sec | head -1 | awk '{print $2}' | cut -d'/' -f2)

        ISO_FILE=$(ls output/*.iso | head -1)
        if [ -n "$GPG_PASSPHRASE" ]; then
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --detach-sign --armor -u "$KEY_ID" "$ISO_FILE"
        else
          gpg --batch --yes --detach-sign --armor -u "$KEY_ID" "$ISO_FILE"
        fi

        gpg --armor --export "$KEY_ID" > output/nubiferos-signing-key.pub
        rm -rf "$GNUPGHOME"

    - name: Get ISO info
      id: iso_info
      run: |
        ISO_FILE=$(ls output/*.iso | head -1)
        ISO_SIZE=$(du -h "$ISO_FILE" | cut -f1)
        echo "iso_file=$ISO_FILE" >> $GITHUB_OUTPUT
        echo "iso_size=$ISO_SIZE" >> $GITHUB_OUTPUT

    - name: Generate release notes
      id: release_notes
      run: |
        git fetch --tags
        LAST_TAG=$(git tag -l 'build-*' --sort=-v:refname | head -1)

        if [ -n "$LAST_TAG" ]; then
          NOTES=$(git log --pretty=format:"- %s" "$LAST_TAG"..HEAD | head -20)
        else
          NOTES=$(git log --pretty=format:"- %s" -10)
        fi

        NOTES_ESCAPED=$(echo "$NOTES" | jq -Rs .)
        echo "notes=$NOTES_ESCAPED" >> $GITHUB_OUTPUT

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag "build-${{ env.COMMIT_SHA }}" || true
        git push origin "build-${{ env.COMMIT_SHA }}" || true

    - name: Upload to staging
      run: |
        ISO_FILE=$(basename output/*.iso)
        BUILD_PATH="staging/builds/${{ env.COMMIT_SHA }}"

        echo "=========================================="
        echo "Uploading to STAGING"
        echo "=========================================="

        aws s3 cp output/*.iso s3://${{ env.ISO_BUCKET }}/$BUILD_PATH/ \
          --storage-class INTELLIGENT_TIERING \
          --metadata "version=${{ env.VERSION }},commit=${{ env.COMMIT_SHA }},github-run=${{ github.run_number }}"

        aws s3 cp output/SHA256SUMS s3://${{ env.ISO_BUCKET }}/$BUILD_PATH/
        aws s3 cp output/MD5SUMS s3://${{ env.ISO_BUCKET }}/$BUILD_PATH/
        [ -f output/sbom-cyclonedx.json ] && aws s3 cp output/sbom-cyclonedx.json s3://${{ env.ISO_BUCKET }}/$BUILD_PATH/
        [ -f output/vuln-report.json ] && aws s3 cp output/vuln-report.json s3://${{ env.ISO_BUCKET }}/$BUILD_PATH/
        [ -f output/*.iso.asc ] && aws s3 cp output/*.iso.asc s3://${{ env.ISO_BUCKET }}/$BUILD_PATH/
        [ -f output/nubiferos-signing-key.pub ] && aws s3 cp output/nubiferos-signing-key.pub s3://${{ env.ISO_BUCKET }}/$BUILD_PATH/

        # Maintain staging version path for release workflow
        aws s3 rm s3://${{ env.ISO_BUCKET }}/staging/${{ env.VERSION }}/ --recursive
        aws s3 sync s3://${{ env.ISO_BUCKET }}/$BUILD_PATH/ s3://${{ env.ISO_BUCKET }}/staging/${{ env.VERSION }}/ \
          --storage-class INTELLIGENT_TIERING

        aws s3 cp output/*.iso s3://${{ env.ISO_BUCKET }}/staging/nubiferos-latest.iso \
          --storage-class INTELLIGENT_TIERING
        aws s3 cp output/SHA256SUMS s3://${{ env.ISO_BUCKET }}/staging/nubiferos-latest.iso.sha256

        echo "✓ Uploaded to staging"

    - name: Update builds manifest
      run: |
        ISO_FILE=$(basename output/*.iso)
        ISO_SIZE="${{ steps.iso_info.outputs.iso_size }}"
        SHA256=$(cat output/SHA256SUMS | awk '{print $1}')
        BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        PRESIGNED_URL=$(aws s3 presign s3://${{ env.ISO_BUCKET }}/staging/builds/${{ env.COMMIT_SHA }}/$ISO_FILE --expires-in 604800)

        cat > /tmp/this_build.json << EOF
        {
          "version": "${{ env.VERSION }}",
          "commit": "${{ env.COMMIT_SHA }}",
          "commit_full": "${{ github.sha }}",
          "date": "$BUILD_DATE",
          "iso_file": "$ISO_FILE",
          "iso_size": "$ISO_SIZE",
          "sha256": "$SHA256",
          "status": "untested",
          "download_url": "$PRESIGNED_URL",
          "github_run": "${{ github.run_number }}",
          "github_run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
          "release_notes": ${{ steps.release_notes.outputs.notes }}
        }
        EOF

        aws s3 cp s3://${{ env.ISO_BUCKET }}/staging/builds.json /tmp/builds.json 2>/dev/null || echo '{"builds":[]}' > /tmp/builds.json

        jq --slurpfile new /tmp/this_build.json '.builds = ([$new[0]] + .builds) | .builds = .builds[:3] | .updated = now | .updated_iso = "'$BUILD_DATE'"' /tmp/builds.json > /tmp/builds_updated.json

        aws s3 cp /tmp/builds_updated.json s3://${{ env.ISO_BUCKET }}/staging/builds.json \
          --content-type "application/json" \
          --cache-control "max-age=60"

        echo "✓ Updated builds.json manifest"

    - name: Cleanup old builds
      run: |
        # Keep the builds listed in the manifest (newest-first, capped at 3).
        # NOTE: `aws s3 ls` returns prefixes alphabetically, NOT by date —
        # the old `tail -n +4` approach deleted the newest builds.
        if [ ! -f /tmp/builds_updated.json ]; then
          aws s3 cp s3://${{ env.ISO_BUCKET }}/staging/builds.json /tmp/builds_updated.json
        fi
        KEEP=$(jq -r '.builds[].commit' /tmp/builds_updated.json)
        echo "Keeping builds: $KEEP"

        aws s3 ls s3://${{ env.ISO_BUCKET }}/staging/builds/ | awk '{print $2}' | sed 's#/##' | while read -r BUILD; do
          [ -n "$BUILD" ] || continue
          if echo "$KEEP" | grep -qx "$BUILD"; then
            echo "Keeping: $BUILD"
          else
            echo "Removing old build: $BUILD"
            aws s3 rm s3://${{ env.ISO_BUCKET }}/staging/builds/$BUILD/ --recursive
          fi
        done
        echo "✓ Cleaned up old builds (kept manifest builds)"

    - name: Generate staging presigned URL
      id: staging_url
      run: |
        ISO_FILE=$(basename output/*.iso)
        PRESIGNED_URL=$(aws s3 presign s3://${{ env.ISO_BUCKET }}/staging/builds/${{ env.COMMIT_SHA }}/$ISO_FILE --expires-in 604800)
        echo "presigned_url=$PRESIGNED_URL" >> $GITHUB_OUTPUT

    - name: Build summary
      run: |
        cat >> $GITHUB_STEP_SUMMARY << EOF
        # 🔨 NubiferOS ISO Build Complete (STAGING)

        ## Build Information
        - **Version**: ${{ env.VERSION }}
        - **ISO Name**: ${{ env.ISO_NAME }}
        - **ISO Size**: ${{ steps.iso_info.outputs.iso_size }}
        - **Commit**: \`${{ env.COMMIT_SHA }}\`
        - **Status**: ⚠️ **UNTESTED** (staging build)

        ## Download for Testing
        **Presigned URL** (valid 7 days):
        \`\`\`
        ${{ steps.staging_url.outputs.presigned_url }}
        \`\`\`

        ## Checksums
        \`\`\`
        $(cat output/SHA256SUMS)
        \`\`\`

        ## Release Notes
        $(echo ${{ steps.release_notes.outputs.notes }} | jq -r .)

        ## ⏭️ Pipeline
        1. ✅ **Build** — complete
        2. ⏳ **Test** — auto-triggered (or re-run manually via [Test ISO](/${{ github.repository }}/actions/workflows/test-iso.yml))
        3. ⏳ **Release** — run [Release to Production](/${{ github.repository }}/actions/workflows/release.yml) after tests pass

        > **Note:** APT packages are published separately via the [Build & Publish Packages](/${{ github.repository }}/actions/workflows/publish-packages.yml) workflow.
        EOF
