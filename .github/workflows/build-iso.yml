name: Build NubiferOS ISO

on:
  # Disabled auto-build on push to reduce CI overhead during development
  # push:
  #   branches: [ main, develop, trunk ]
  #   tags:
  #     - 'v*'
  # pull_request:
  #   branches: [ main, trunk ]
  
  # Only build on release tags and manual trigger
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Allow manual trigger

# Required for OIDC authentication
permissions:
  id-token: write
  contents: read

env:
  ISO_BUCKET: nubiferos-iso
  AWS_REGION: us-east-1

jobs:
  build-iso:
    runs-on: ubuntu-latest
    
    # Use a larger runner if available (optional, costs extra)
    # runs-on: ubuntu-latest-8-cores
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Free up disk space
      run: |
        echo "Disk space before cleanup:"
        df -h
        
        # Remove unnecessary packages to free up space
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        
        echo ""
        echo "Disk space after cleanup:"
        df -h
        
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          debootstrap \
          squashfs-tools \
          xorriso \
          isolinux \
          syslinux-efi \
          grub-pc-bin \
          grub-efi-amd64-bin \
          mtools \
          dosfstools \
          wget \
          curl \
          git \
          qemu-system-x86 \
          qemu-utils \
          genisoimage \
          python3-pip \
          gnupg
        
        # Install pytest for testing
        pip3 install pytest
        
    - name: Install security scanning tools
      run: |
        echo "Installing security scanning tools..."
        
        # Install syft for SBOM generation
        curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin
        
        # Install grype for vulnerability scanning
        curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sudo sh -s -- -b /usr/local/bin
        
        echo "✓ Security tools installed"
        syft version
        grype version
          
    - name: Set up build environment
      run: |
        # Create necessary directories
        sudo mkdir -p /var/cache/apt/archives
        sudo mkdir -p output
        
        # Get version from brand config
        VERSION=$(grep 'BRAND_VERSION=' brand/brand.conf | cut -d'"' -f2)
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        
        # Set ISO filename with timestamp and commit SHA for uniqueness
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        COMMIT_SHA=$(git rev-parse --short HEAD)
        ISO_NAME="nubiferos-${VERSION}-${TIMESTAMP}-${COMMIT_SHA}-amd64.iso"
        echo "ISO_NAME=$ISO_NAME" >> $GITHUB_ENV
        echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
        
    - name: Generate Calamares configuration
      run: |
        echo "Generating Calamares installer configuration..."
        cd build
        chmod +x setup-calamares-minimal.sh install-calamares.sh configure-installer-autostart.sh
        ./setup-calamares-minimal.sh
        cd ..
        
    - name: Configure AWS credentials (pre-build test)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Test S3 connectivity before build
      run: |
        echo "=========================================="
        echo "Testing S3 Access Before Build"
        echo "=========================================="
        echo ""
        echo "This prevents wasting 30-40 minutes on a build"
        echo "only to find out S3 upload will fail."
        echo ""
        
        # Test bucket exists and we have access
        echo "Testing bucket access..."
        if ! aws s3 ls s3://${{ env.ISO_BUCKET }}/ 2>&1; then
          echo ""
          echo "❌ ERROR: Cannot access S3 bucket: ${{ env.ISO_BUCKET }}"
          echo ""
          echo "Possible issues:"
          echo "  1. Bucket doesn't exist"
          echo "  2. IAM role lacks s3:ListBucket permission"
          echo "  3. Bucket is in a different region"
          echo ""
          echo "Please check:"
          echo "  - Bucket name: ${{ env.ISO_BUCKET }}"
          echo "  - Region: ${{ env.AWS_REGION }}"
          echo "  - IAM role permissions"
          echo ""
          echo "Fix these issues before running the build again."
          exit 1
        fi
        
        # Test write permissions with a small test file
        echo "✓ Bucket accessible"
        echo ""
        echo "Testing write permissions..."
        TEST_FILE="test-upload-${{ github.run_number }}.txt"
        echo "GitHub Actions test upload - Run #${{ github.run_number }} - $(date)" > "$TEST_FILE"
        
        if ! aws s3 cp "$TEST_FILE" "s3://${{ env.ISO_BUCKET }}/.github-actions-test/$TEST_FILE"; then
          echo ""
          echo "❌ ERROR: Cannot write to S3 bucket"
          echo ""
          echo "IAM role needs s3:PutObject permission on:"
          echo "  arn:aws:s3:::${{ env.ISO_BUCKET }}/*"
          echo ""
          echo "Add this to your IAM role policy:"
          echo '{'
          echo '  "Effect": "Allow",'
          echo '  "Action": ["s3:PutObject", "s3:GetObject", "s3:ListBucket"],'
          echo '  "Resource": ['
          echo '    "arn:aws:s3:::${{ env.ISO_BUCKET }}",'
          echo '    "arn:aws:s3:::${{ env.ISO_BUCKET }}/*"'
          echo '  ]'
          echo '}'
          rm -f "$TEST_FILE"
          exit 1
        fi
        
        # Clean up test file
        aws s3 rm "s3://${{ env.ISO_BUCKET }}/.github-actions-test/$TEST_FILE" || true
        rm -f "$TEST_FILE"
        
        echo "✓ Write permissions confirmed"
        echo ""
        echo "=========================================="
        echo "S3 Access Test: PASSED ✓"
        echo "=========================================="
        echo "Bucket: s3://${{ env.ISO_BUCKET }}"
        echo "Region: ${{ env.AWS_REGION }}"
        echo ""
        echo "Proceeding with ISO build..."
        echo ""
        
    - name: Build ISO
      run: |
        # Set NON_INTERACTIVE mode
        export NON_INTERACTIVE=true
        
        # Run build with verbose output
        sudo -E bash -x ./build-nubiferos.sh 2>&1 | tee build.log || {
          echo ""
          echo "=========================================="
          echo "BUILD FAILED!"
          echo "=========================================="
          echo ""
          echo "Last 200 lines of output:"
          tail -n 200 build.log
          echo ""
          echo "Checking for any output files:"
          ls -la output/ || echo "output/ directory not found"
          ls -la work/ || echo "work/ directory not found"
          exit 1
        }
        
    - name: Verify build output
      if: success()
      run: |
        echo "Checking build output..."
        ls -la output/ || {
          echo "ERROR: output/ directory not found!"
          echo "Checking work directory:"
          ls -la work/ || echo "work/ directory not found"
          exit 1
        }
        
        if [ ! -f output/*.iso ]; then
          echo "ERROR: No ISO file found in output/"
          echo "Contents of output/:"
          ls -la output/
          exit 1
        fi
        
    - name: Generate checksums
      if: success()
      run: |
        if [ -d output ] && [ -f output/*.iso ]; then
          # Fix permissions on output directory
          sudo chown -R $USER:$USER output/
          
          cd output
          sha256sum *.iso > SHA256SUMS
          md5sum *.iso > MD5SUMS
          echo "Checksums generated:"
          cat SHA256SUMS
        else
          echo "ERROR: No ISO files found to generate checksums"
          exit 1
        fi
        
    - name: Generate SBOM
      if: success()
      run: |
        echo "=========================================="
        echo "Generating Software Bill of Materials"
        echo "=========================================="
        
        ISO_FILE=$(ls output/*.iso | head -1)
        
        # Mount ISO to scan contents
        sudo mkdir -p /mnt/iso
        sudo mount -o loop "$ISO_FILE" /mnt/iso
        
        # Find and mount squashfs
        if [ -f /mnt/iso/live/filesystem.squashfs ]; then
          sudo mkdir -p /mnt/squashfs
          sudo mount -o loop /mnt/iso/live/filesystem.squashfs /mnt/squashfs
          SCAN_PATH="/mnt/squashfs"
        else
          SCAN_PATH="/mnt/iso"
        fi
        
        # Generate SBOM in CycloneDX format
        echo "Generating CycloneDX SBOM..."
        sudo syft dir:$SCAN_PATH -o cyclonedx-json > output/sbom-cyclonedx.json 2>/dev/null || {
          echo "Warning: syft scan had issues, trying alternative method..."
          syft dir:$SCAN_PATH -o cyclonedx-json > output/sbom-cyclonedx.json || true
        }
        
        # Generate SBOM in SPDX format
        echo "Generating SPDX SBOM..."
        sudo syft dir:$SCAN_PATH -o spdx-json > output/sbom-spdx.json 2>/dev/null || true
        
        # Cleanup mounts
        sudo umount /mnt/squashfs 2>/dev/null || true
        sudo umount /mnt/iso 2>/dev/null || true
        
        # Check results
        if [ -f output/sbom-cyclonedx.json ] && [ -s output/sbom-cyclonedx.json ]; then
          COMPONENT_COUNT=$(jq '.components | length' output/sbom-cyclonedx.json 2>/dev/null || echo "unknown")
          echo "✓ SBOM generated with $COMPONENT_COUNT components"
        else
          echo "⚠️ SBOM generation may have had issues"
        fi
        
    - name: Run vulnerability scan
      if: success()
      continue-on-error: true
      run: |
        echo "=========================================="
        echo "Running Vulnerability Scan"
        echo "=========================================="
        
        # Scan using SBOM if available
        if [ -f output/sbom-cyclonedx.json ] && [ -s output/sbom-cyclonedx.json ]; then
          echo "Scanning SBOM for vulnerabilities..."
          grype sbom:output/sbom-cyclonedx.json -o json > output/vuln-report.json 2>/dev/null || true
          grype sbom:output/sbom-cyclonedx.json -o table > output/vuln-report.txt 2>/dev/null || true
        else
          echo "No SBOM available, scanning ISO directly..."
          ISO_FILE=$(ls output/*.iso | head -1)
          sudo mkdir -p /mnt/iso /mnt/squashfs
          sudo mount -o loop "$ISO_FILE" /mnt/iso
          if [ -f /mnt/iso/live/filesystem.squashfs ]; then
            sudo mount -o loop /mnt/iso/live/filesystem.squashfs /mnt/squashfs
            grype dir:/mnt/squashfs -o json > output/vuln-report.json 2>/dev/null || true
            grype dir:/mnt/squashfs -o table > output/vuln-report.txt 2>/dev/null || true
            sudo umount /mnt/squashfs
          fi
          sudo umount /mnt/iso
        fi
        
        # Parse results
        if [ -f output/vuln-report.json ] && [ -s output/vuln-report.json ]; then
          CRITICAL=$(jq '[.matches[] | select(.vulnerability.severity == "Critical")] | length' output/vuln-report.json 2>/dev/null || echo "0")
          HIGH=$(jq '[.matches[] | select(.vulnerability.severity == "High")] | length' output/vuln-report.json 2>/dev/null || echo "0")
          MEDIUM=$(jq '[.matches[] | select(.vulnerability.severity == "Medium")] | length' output/vuln-report.json 2>/dev/null || echo "0")
          
          echo ""
          echo "Vulnerability Summary:"
          echo "  Critical: $CRITICAL"
          echo "  High: $HIGH"
          echo "  Medium: $MEDIUM"
          echo ""
          
          # Save summary for later steps
          echo "VULN_CRITICAL=$CRITICAL" >> $GITHUB_ENV
          echo "VULN_HIGH=$HIGH" >> $GITHUB_ENV
          echo "VULN_MEDIUM=$MEDIUM" >> $GITHUB_ENV
          
          # Fail on critical vulnerabilities (can be adjusted)
          if [ "$CRITICAL" -gt 0 ]; then
            echo "⚠️ Critical vulnerabilities found - review required"
            cat output/vuln-report.txt | head -50
          fi
        else
          echo "⚠️ Vulnerability scan did not produce results"
        fi
        
    - name: Sign ISO
      if: success()
      continue-on-error: true
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        echo "=========================================="
        echo "Signing ISO"
        echo "=========================================="
        
        # Skip if no GPG key configured
        if [ -z "$GPG_PRIVATE_KEY" ]; then
          echo "ℹ️ GPG_PRIVATE_KEY secret not configured - skipping signing"
          echo "To enable ISO signing, add GPG_PRIVATE_KEY secret to the repository"
          exit 0
        fi
        
        # Create isolated GPG home directory FIRST to avoid permission issues
        # The default ~/.gnupg may have been affected by sudo commands earlier
        export GNUPGHOME=$(mktemp -d -t gpg-signing-XXXXXX)
        chmod 700 "$GNUPGHOME"
        echo "Using temporary GPG home: $GNUPGHOME"
        
        # Import GPG key
        echo "Importing GPG key..."
        if ! echo "$GPG_PRIVATE_KEY" | gpg --batch --import 2>&1; then
          echo "⚠️ Failed to import GPG key - skipping signing"
          echo "Check that GPG_PRIVATE_KEY contains valid ASCII-armored key data"
          rm -rf "$GNUPGHOME"
          exit 0
        fi
        
        # Get key ID
        KEY_ID=$(gpg --list-secret-keys --keyid-format LONG 2>/dev/null | grep sec | head -1 | awk '{print $2}' | cut -d'/' -f2)
        
        if [ -z "$KEY_ID" ]; then
          echo "⚠️ No secret key found after import - skipping signing"
          rm -rf "$GNUPGHOME"
          exit 0
        fi
        
        echo "Using GPG key: $KEY_ID"
        
        # Sign ISO
        ISO_FILE=$(ls output/*.iso | head -1)
        echo "Signing: $ISO_FILE"
        
        if [ -n "$GPG_PASSPHRASE" ]; then
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --detach-sign --armor -u "$KEY_ID" "$ISO_FILE"
        else
          gpg --batch --yes --detach-sign --armor -u "$KEY_ID" "$ISO_FILE"
        fi
        
        # Export public key
        gpg --armor --export "$KEY_ID" > output/nubiferos-signing-key.pub
        
        # Cleanup temp GPG home
        rm -rf "$GNUPGHOME"
        
        if [ -f "${ISO_FILE}.asc" ]; then
          echo "✓ ISO signed: ${ISO_FILE}.asc"
          echo "✓ Public key exported: output/nubiferos-signing-key.pub"
        else
          echo "⚠️ Signing may have failed"
        fi
        
    - name: Get ISO info
      if: success()
      id: iso_info
      run: |
        ISO_FILE=$(ls output/*.iso | head -1)
        ISO_SIZE=$(du -h "$ISO_FILE" | cut -f1)
        echo "iso_file=$ISO_FILE" >> $GITHUB_OUTPUT
        echo "iso_size=$ISO_SIZE" >> $GITHUB_OUTPUT
        
    - name: Run ISO validation tests
      if: success()
      run: |
        echo "=========================================="
        echo "Running ISO Validation Tests"
        echo "=========================================="
        echo ""
        
        # Set ISO path for pytest
        export ISO_PATH=$(realpath output/*.iso)
        echo "Testing ISO: $ISO_PATH"
        echo ""
        
        # Run basic validation tests
        echo "Running basic validation tests..."
        pytest testing/test-iso-pytest.py::TestISOBasics -v -s || {
          echo "❌ Basic validation tests failed!"
          exit 1
        }
        
        echo ""
        echo "✅ Basic validation tests passed!"
        echo ""
        
    - name: Enable KVM (if possible)
      if: success()
      run: |
        echo "Attempting to enable KVM..."
        
        # Check if KVM module exists
        if lsmod | grep -q kvm; then
          echo "✅ KVM module loaded"
        else
          echo "⚠️  KVM module not loaded"
        fi
        
        # Try to fix permissions on /dev/kvm
        if [ -e /dev/kvm ]; then
          echo "✅ /dev/kvm exists"
          sudo chmod 666 /dev/kvm || echo "⚠️  Could not change /dev/kvm permissions"
          ls -la /dev/kvm
        else
          echo "⚠️  /dev/kvm does not exist - nested virtualization not available"
        fi
        
    - name: Run ISO boot test
      if: success()
      run: |
        echo "=========================================="
        echo "Running ISO Boot Test with QEMU"
        echo "=========================================="
        echo ""
        
        # Check if KVM is accessible
        if [ -e /dev/kvm ] && [ -r /dev/kvm ]; then
          echo "✅ KVM is accessible - boot test will be fast!"
        else
          echo "⚠️  KVM not accessible - boot tests will be skipped"
        fi
        echo ""
        
        # Set ISO path for pytest
        export ISO_PATH=$(realpath output/*.iso)
        
        # Run boot tests (will skip if KVM not available)
        echo "Running boot tests..."
        pytest testing/test-iso-pytest.py::TestISOBoot -v -s || {
          echo ""
          echo "⚠️  Boot tests failed or were skipped"
          echo "This is not critical - the ISO may still work"
          echo "Manual testing recommended"
          echo ""
          # Don't fail the build for boot test failures
          exit 0
        }
        
        echo ""
        echo "✅ Boot tests passed!"
        echo ""
        
    - name: Re-authenticate to AWS for S3 upload
      if: success()
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Clean up old checksums in S3
      if: success()
      run: |
        echo "=========================================="
        echo "Cleaning up old checksums"
        echo "=========================================="
        echo ""
        
        # Remove old checksum files for this version (keep only the latest)
        echo "Removing old checksums for version ${{ env.VERSION }}..."
        aws s3 ls s3://${{ env.ISO_BUCKET }}/${{ env.VERSION }}/ | grep -E '(SHA256SUMS|MD5SUMS)-' | awk '{print $4}' | while read file; do
          echo "  Deleting: $file"
          aws s3 rm s3://${{ env.ISO_BUCKET }}/${{ env.VERSION }}/$file
        done
        
        echo "✓ Old checksums cleaned up"
        echo ""
        
    - name: Upload ISO to S3
      if: success()
      run: |
        ISO_FILE=$(basename output/*.iso)
        S3_PATH="s3://${{ env.ISO_BUCKET }}/${{ env.VERSION }}/$ISO_FILE"
        
        echo "=========================================="
        echo "Uploading to S3"
        echo "=========================================="
        echo ""
        echo "ISO: $ISO_FILE"
        echo "Destination: $S3_PATH"
        echo "Commit: ${{ env.COMMIT_SHA }}"
        echo ""
        
        # Upload ISO with metadata
        aws s3 cp output/*.iso s3://${{ env.ISO_BUCKET }}/${{ env.VERSION }}/ \
          --storage-class INTELLIGENT_TIERING \
          --metadata "version=${{ env.VERSION }},build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ),commit=${{ env.COMMIT_SHA }},github-run=${{ github.run_number }}"
        
        # Upload checksums (without commit SHA - just one set per version)
        aws s3 cp output/SHA256SUMS s3://${{ env.ISO_BUCKET }}/${{ env.VERSION }}/SHA256SUMS
        aws s3 cp output/MD5SUMS s3://${{ env.ISO_BUCKET }}/${{ env.VERSION }}/MD5SUMS
        
        # Upload security artifacts
        echo "Uploading security artifacts..."
        
        # SBOM files
        if [ -f output/sbom-cyclonedx.json ]; then
          aws s3 cp output/sbom-cyclonedx.json s3://${{ env.ISO_BUCKET }}/${{ env.VERSION }}/sbom-cyclonedx.json
          echo "✓ Uploaded SBOM (CycloneDX)"
        fi
        if [ -f output/sbom-spdx.json ]; then
          aws s3 cp output/sbom-spdx.json s3://${{ env.ISO_BUCKET }}/${{ env.VERSION }}/sbom-spdx.json
          echo "✓ Uploaded SBOM (SPDX)"
        fi
        
        # Vulnerability report
        if [ -f output/vuln-report.json ]; then
          aws s3 cp output/vuln-report.json s3://${{ env.ISO_BUCKET }}/${{ env.VERSION }}/vuln-report.json
          echo "✓ Uploaded vulnerability report"
        fi
        if [ -f output/vuln-report.txt ]; then
          aws s3 cp output/vuln-report.txt s3://${{ env.ISO_BUCKET }}/${{ env.VERSION }}/vuln-report.txt
        fi
        
        # GPG signature and public key
        if [ -f output/*.iso.asc ]; then
          aws s3 cp output/*.iso.asc s3://${{ env.ISO_BUCKET }}/${{ env.VERSION }}/
          echo "✓ Uploaded ISO signature"
        fi
        if [ -f output/nubiferos-signing-key.pub ]; then
          aws s3 cp output/nubiferos-signing-key.pub s3://${{ env.ISO_BUCKET }}/${{ env.VERSION }}/nubiferos-signing-key.pub
          # Also upload to root for easy access
          aws s3 cp output/nubiferos-signing-key.pub s3://${{ env.ISO_BUCKET }}/nubiferos-signing-key.pub
          echo "✓ Uploaded signing public key"
        fi
        
        echo "✓ ISO uploaded: $S3_PATH"
        echo ""
        
        # Copy to "latest" location for easy access
        echo "Creating 'latest' symlink..."
        aws s3 cp output/*.iso s3://${{ env.ISO_BUCKET }}/nubiferos-latest.iso \
          --storage-class INTELLIGENT_TIERING \
          --metadata "version=${{ env.VERSION }},build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ),commit=${{ env.COMMIT_SHA }},github-run=${{ github.run_number }}"
        
        aws s3 cp output/SHA256SUMS s3://${{ env.ISO_BUCKET }}/nubiferos-latest.iso.sha256
        
        # Copy latest security artifacts
        if [ -f output/sbom-cyclonedx.json ]; then
          aws s3 cp output/sbom-cyclonedx.json s3://${{ env.ISO_BUCKET }}/nubiferos-latest-sbom.json
        fi
        if [ -f output/*.iso.asc ]; then
          aws s3 cp output/*.iso.asc s3://${{ env.ISO_BUCKET }}/nubiferos-latest.iso.asc
        fi
        
        echo "✓ Latest symlink created"
        echo ""
        
        # Create a version pointer
        echo "${{ env.VERSION }}" | aws s3 cp - s3://${{ env.ISO_BUCKET }}/latest-version.txt
        
        echo "=========================================="
        echo "Upload Complete!"
        echo "=========================================="
        echo ""
        echo "Versioned: s3://${{ env.ISO_BUCKET }}/${{ env.VERSION }}/$ISO_FILE"
        echo "Latest: s3://${{ env.ISO_BUCKET }}/nubiferos-latest.iso"
        echo ""
        
    - name: Generate presigned URL
      if: success()
      id: presigned_url
      run: |
        ISO_FILE=$(basename output/*.iso)
        PRESIGNED_URL=$(aws s3 presign s3://${{ env.ISO_BUCKET }}/${{ env.VERSION }}/$ISO_FILE --expires-in 604800)
        echo "presigned_url=$PRESIGNED_URL" >> $GITHUB_OUTPUT
        
    - name: Create build summary
      if: success()
      run: |
        # Prepare security summary
        SECURITY_SUMMARY=""
        if [ -f output/sbom-cyclonedx.json ]; then
          SBOM_COMPONENTS=$(jq '.components | length' output/sbom-cyclonedx.json 2>/dev/null || echo "unknown")
          SECURITY_SUMMARY="$SECURITY_SUMMARY\n- **SBOM**: ✅ Generated ($SBOM_COMPONENTS components)"
        else
          SECURITY_SUMMARY="$SECURITY_SUMMARY\n- **SBOM**: ⚠️ Not generated"
        fi
        
        if [ -f output/vuln-report.json ]; then
          SECURITY_SUMMARY="$SECURITY_SUMMARY\n- **Vulnerabilities**: Critical: ${VULN_CRITICAL:-0}, High: ${VULN_HIGH:-0}, Medium: ${VULN_MEDIUM:-0}"
        else
          SECURITY_SUMMARY="$SECURITY_SUMMARY\n- **Vulnerabilities**: ⚠️ Scan not completed"
        fi
        
        if [ -f output/*.iso.asc ]; then
          SECURITY_SUMMARY="$SECURITY_SUMMARY\n- **Signature**: ✅ ISO signed"
        else
          SECURITY_SUMMARY="$SECURITY_SUMMARY\n- **Signature**: ⚠️ Not signed (GPG key not configured)"
        fi
        
        cat >> $GITHUB_STEP_SUMMARY << EOF
        # 🎉 NubiferOS ISO Build Complete!
        
        ## Build Information
        - **Version**: ${{ env.VERSION }}
        - **ISO Name**: ${{ env.ISO_NAME }}
        - **ISO Size**: ${{ steps.iso_info.outputs.iso_size }}
        - **Build Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        - **Commit**: ${{ github.sha }}
        - **Tests**: ✅ All validation tests passed
        
        ## Security
        $(echo -e "$SECURITY_SUMMARY")
        
        ## S3 Locations
        
        ### Latest (always points to newest build)
        \`\`\`
        s3://${{ env.ISO_BUCKET }}/nubiferos-latest.iso
        \`\`\`
        
        ### Versioned (permanent)
        \`\`\`
        s3://${{ env.ISO_BUCKET }}/${{ env.VERSION }}/$(basename output/*.iso)
        \`\`\`
        
        ### Security Artifacts
        \`\`\`
        s3://${{ env.ISO_BUCKET }}/${{ env.VERSION }}/sbom-cyclonedx.json
        s3://${{ env.ISO_BUCKET }}/${{ env.VERSION }}/vuln-report.json
        s3://${{ env.ISO_BUCKET }}/nubiferos-signing-key.pub
        \`\`\`
        
        ## Download
        **Presigned URL** (valid for 7 days): 
        \`\`\`
        ${{ steps.presigned_url.outputs.presigned_url }}
        \`\`\`
        
        ## Checksums
        \`\`\`
        $(cat output/SHA256SUMS)
        \`\`\`
        
        ## Verify ISO Signature
        \`\`\`bash
        # Download public key
        curl -O https://nubiferos-iso.s3.amazonaws.com/nubiferos-signing-key.pub
        gpg --import nubiferos-signing-key.pub
        
        # Verify signature
        gpg --verify nubiferos-latest.iso.asc nubiferos-latest.iso
        \`\`\`
        
        ## Testing Results
        - ✅ ISO format validation passed
        - ✅ ISO size validation passed (within 1-10GB range)
        - ✅ Boot test passed (or skipped if KVM unavailable)
        
        ## Next Steps
        
        ### For Testing
        1. Download the ISO using the presigned URL above
        2. Verify checksums match
        3. Verify GPG signature (if signed)
        4. Test in VirtualBox or QEMU
        5. Report any issues
        
        ### For Production Release
        1. Tag the commit: \`git tag v${{ env.VERSION }}\`
        2. Push the tag: \`git push origin v${{ env.VERSION }}\`
        3. This will trigger AMI creation via CodeBuild
        4. AMI will be available in AWS for deployment
        
        ## AWS Integration
        - **CodeBuild**: Will validate ISO from S3
        - **Packer**: Can create AMI from this ISO (on release tags)
        - **Latest symlink**: Always points to this build
        EOF
        
    # Artifact upload removed - checksums are uploaded to S3 alongside the ISO
    # No need for GitHub artifact storage since everything is in S3
        
    - name: Trigger CodeBuild for AMI creation (on release tags)
      if: success() && startsWith(github.ref, 'refs/tags/v')
      run: |
        echo "=========================================="
        echo "Triggering CodeBuild for AMI Creation"
        echo "=========================================="
        echo ""
        echo "This will:"
        echo "  1. Download the ISO from S3"
        echo "  2. Run validation tests"
        echo "  3. Create an AWS AMI using Packer"
        echo ""
        
        # Check if CodeBuild project exists
        PROJECT_NAME="nubiferos-ami-builder"
        
        if aws codebuild list-projects | grep -q "$PROJECT_NAME"; then
          echo "Starting CodeBuild project: $PROJECT_NAME"
          
          BUILD_ID=$(aws codebuild start-build \
            --project-name "$PROJECT_NAME" \
            --environment-variables-override \
              name=ISO_VERSION,value=${{ env.VERSION }},type=PLAINTEXT \
              name=ISO_KEY,value=${{ env.VERSION }}/$(basename output/*.iso),type=PLAINTEXT \
              name=GITHUB_SHA,value=${{ github.sha }},type=PLAINTEXT \
            --query 'build.id' \
            --output text)
          
          echo "✓ CodeBuild started: $BUILD_ID"
          echo ""
          echo "Monitor at: https://console.aws.amazon.com/codesuite/codebuild/projects/$PROJECT_NAME/build/$BUILD_ID"
        else
          echo "⚠️  CodeBuild project '$PROJECT_NAME' not found"
          echo "Skipping AMI creation"
          echo ""
          echo "To enable AMI creation, create a CodeBuild project with:"
          echo "  - Name: $PROJECT_NAME"
          echo "  - Buildspec: aws-testing/codebuild/import-iso-buildspec-packer.yml"
        fi
        echo ""
        
    - name: Comment on PR (if applicable)
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## 🎉 ISO Build Complete!\n\n**Version**: ${{ env.VERSION }}\n**Size**: ${{ steps.iso_info.outputs.iso_size }}\n\n**S3 Locations**:\n- Versioned: \`s3://${{ env.ISO_BUCKET }}/${{ env.VERSION }}/\`\n- Latest: \`s3://${{ env.ISO_BUCKET }}/nubiferos-latest.iso\`\n\n✅ All tests passed!`
          })
