name: Build NubiferOS ISO

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

# Required for OIDC authentication
permissions:
  id-token: write
  contents: read

env:
  ISO_BUCKET: nubiferos-iso
  AWS_REGION: us-east-1

jobs:
  build-iso:
    runs-on: ubuntu-latest
    
    # Use a larger runner if available (optional, costs extra)
    # runs-on: ubuntu-latest-8-cores
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Free up disk space
      run: |
        echo "Disk space before cleanup:"
        df -h
        
        # Remove unnecessary packages to free up space
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        
        echo ""
        echo "Disk space after cleanup:"
        df -h
        
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          debootstrap \
          squashfs-tools \
          xorriso \
          isolinux \
          syslinux-efi \
          grub-pc-bin \
          grub-efi-amd64-bin \
          mtools \
          dosfstools \
          wget \
          curl \
          git
          
    - name: Set up build environment
      run: |
        # Create necessary directories
        sudo mkdir -p /var/cache/apt/archives
        sudo mkdir -p output
        
        # Get version from brand config
        VERSION=$(grep 'BRAND_VERSION=' brand/brand.conf | cut -d'"' -f2)
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        
        # Set ISO filename with timestamp and commit SHA for uniqueness
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        COMMIT_SHA=$(git rev-parse --short HEAD)
        ISO_NAME="nubiferos-${VERSION}-${TIMESTAMP}-${COMMIT_SHA}-amd64.iso"
        echo "ISO_NAME=$ISO_NAME" >> $GITHUB_ENV
        echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
        
    - name: Configure AWS credentials (pre-build test)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Test S3 connectivity before build
      run: |
        echo "=========================================="
        echo "Testing S3 Access Before Build"
        echo "=========================================="
        echo ""
        echo "This prevents wasting 30-40 minutes on a build"
        echo "only to find out S3 upload will fail."
        echo ""
        
        # Test bucket exists and we have access
        echo "Testing bucket access..."
        if ! aws s3 ls s3://${{ env.ISO_BUCKET }}/ 2>&1; then
          echo ""
          echo "❌ ERROR: Cannot access S3 bucket: ${{ env.ISO_BUCKET }}"
          echo ""
          echo "Possible issues:"
          echo "  1. Bucket doesn't exist"
          echo "  2. IAM role lacks s3:ListBucket permission"
          echo "  3. Bucket is in a different region"
          echo ""
          echo "Please check:"
          echo "  - Bucket name: ${{ env.ISO_BUCKET }}"
          echo "  - Region: ${{ env.AWS_REGION }}"
          echo "  - IAM role permissions"
          echo ""
          echo "Fix these issues before running the build again."
          exit 1
        fi
        
        # Test write permissions with a small test file
        echo "✓ Bucket accessible"
        echo ""
        echo "Testing write permissions..."
        TEST_FILE="test-upload-${{ github.run_number }}.txt"
        echo "GitHub Actions test upload - Run #${{ github.run_number }} - $(date)" > "$TEST_FILE"
        
        if ! aws s3 cp "$TEST_FILE" "s3://${{ env.ISO_BUCKET }}/.github-actions-test/$TEST_FILE"; then
          echo ""
          echo "❌ ERROR: Cannot write to S3 bucket"
          echo ""
          echo "IAM role needs s3:PutObject permission on:"
          echo "  arn:aws:s3:::${{ env.ISO_BUCKET }}/*"
          echo ""
          echo "Add this to your IAM role policy:"
          echo '{'
          echo '  "Effect": "Allow",'
          echo '  "Action": ["s3:PutObject", "s3:GetObject", "s3:ListBucket"],'
          echo '  "Resource": ['
          echo '    "arn:aws:s3:::${{ env.ISO_BUCKET }}",'
          echo '    "arn:aws:s3:::${{ env.ISO_BUCKET }}/*"'
          echo '  ]'
          echo '}'
          rm -f "$TEST_FILE"
          exit 1
        fi
        
        # Clean up test file
        aws s3 rm "s3://${{ env.ISO_BUCKET }}/.github-actions-test/$TEST_FILE" || true
        rm -f "$TEST_FILE"
        
        echo "✓ Write permissions confirmed"
        echo ""
        echo "=========================================="
        echo "S3 Access Test: PASSED ✓"
        echo "=========================================="
        echo "Bucket: s3://${{ env.ISO_BUCKET }}"
        echo "Region: ${{ env.AWS_REGION }}"
        echo ""
        echo "Proceeding with ISO build..."
        echo ""
        
    - name: Build ISO
      run: |
        # Set NON_INTERACTIVE mode
        export NON_INTERACTIVE=true
        
        # Run build with verbose output
        sudo -E bash -x ./build-nubiferos.sh 2>&1 | tee build.log || {
          echo ""
          echo "=========================================="
          echo "BUILD FAILED!"
          echo "=========================================="
          echo ""
          echo "Last 200 lines of output:"
          tail -n 200 build.log
          echo ""
          echo "Checking for any output files:"
          ls -la output/ || echo "output/ directory not found"
          ls -la work/ || echo "work/ directory not found"
          exit 1
        }
        
    - name: Verify build output
      if: success()
      run: |
        echo "Checking build output..."
        ls -la output/ || {
          echo "ERROR: output/ directory not found!"
          echo "Checking work directory:"
          ls -la work/ || echo "work/ directory not found"
          exit 1
        }
        
        if [ ! -f output/*.iso ]; then
          echo "ERROR: No ISO file found in output/"
          echo "Contents of output/:"
          ls -la output/
          exit 1
        fi
        
    - name: Generate checksums
      if: success()
      run: |
        if [ -d output ] && [ -f output/*.iso ]; then
          # Fix permissions on output directory
          sudo chown -R $USER:$USER output/
          
          cd output
          sha256sum *.iso > SHA256SUMS
          md5sum *.iso > MD5SUMS
          echo "Checksums generated:"
          cat SHA256SUMS
        else
          echo "ERROR: No ISO files found to generate checksums"
          exit 1
        fi
        
    - name: Get ISO info
      if: success()
      id: iso_info
      run: |
        ISO_FILE=$(ls output/*.iso | head -1)
        ISO_SIZE=$(du -h "$ISO_FILE" | cut -f1)
        echo "iso_file=$ISO_FILE" >> $GITHUB_OUTPUT
        echo "iso_size=$ISO_SIZE" >> $GITHUB_OUTPUT
        
    - name: Re-authenticate to AWS for S3 upload
      if: success()
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Upload ISO to S3
      if: success()
      run: |
        ISO_FILE=$(basename output/*.iso)
        S3_PATH="s3://${{ env.ISO_BUCKET }}/${{ env.VERSION }}/$ISO_FILE"
        
        echo "Uploading $ISO_FILE to S3..."
        echo "Commit: ${{ env.COMMIT_SHA }}"
        
        # Upload ISO with metadata
        aws s3 cp output/*.iso s3://${{ env.ISO_BUCKET }}/${{ env.VERSION }}/ \
          --storage-class INTELLIGENT_TIERING \
          --metadata "version=${{ env.VERSION }},build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ),commit=${{ env.COMMIT_SHA }},github-run=${{ github.run_number }}"
        
        # Upload checksums
        aws s3 cp output/SHA256SUMS s3://${{ env.ISO_BUCKET }}/${{ env.VERSION }}/SHA256SUMS-${{ env.COMMIT_SHA }}
        aws s3 cp output/MD5SUMS s3://${{ env.ISO_BUCKET }}/${{ env.VERSION }}/MD5SUMS-${{ env.COMMIT_SHA }}
        
        echo "✓ Upload complete: $S3_PATH"
        
        # Create a "latest" pointer for this version
        echo "${{ env.VERSION }}" | aws s3 cp - s3://${{ env.ISO_BUCKET }}/latest.txt
        
    - name: Generate presigned URL
      if: success()
      id: presigned_url
      run: |
        ISO_FILE=$(basename output/*.iso)
        PRESIGNED_URL=$(aws s3 presign s3://${{ env.ISO_BUCKET }}/${{ env.VERSION }}/$ISO_FILE --expires-in 604800)
        echo "presigned_url=$PRESIGNED_URL" >> $GITHUB_OUTPUT
        
    - name: Create build summary
      if: success()
      run: |
        cat >> $GITHUB_STEP_SUMMARY << EOF
        # 🎉 NubiferOS ISO Build Complete!
        
        ## Build Information
        - **Version**: ${{ env.VERSION }}
        - **ISO Name**: ${{ env.ISO_NAME }}
        - **ISO Size**: ${{ steps.iso_info.outputs.iso_size }}
        - **Build Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        - **Commit**: ${{ github.sha }}
        
        ## Download
        - **S3 Location**: s3://${{ env.ISO_BUCKET }}/${{ env.VERSION }}/
        - **Download URL** (valid for 7 days): 
          \`\`\`
          ${{ steps.presigned_url.outputs.presigned_url }}
          \`\`\`
        
        ## Checksums
        \`\`\`
        $(cat output/SHA256SUMS)
        \`\`\`
        
        ## Next Steps
        1. Download the ISO using the presigned URL above
        2. Verify checksums
        3. Test in VirtualBox or on hardware
        4. Report any issues
        EOF
        
    - name: Upload artifacts (backup)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: nubiferos-iso-${{ env.VERSION }}
        path: |
          output/*.iso
          output/SHA256SUMS
          output/MD5SUMS
        retention-days: 7  # Keep for 7 days as backup
        
    - name: Comment on PR (if applicable)
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## 🎉 ISO Build Complete!\n\n**Version**: ${{ env.VERSION }}\n**Size**: ${{ steps.iso_info.outputs.iso_size }}\n\nDownload from S3: \`s3://${{ env.ISO_BUCKET }}/${{ env.VERSION }}/\``
          })
