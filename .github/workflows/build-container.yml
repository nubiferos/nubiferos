name: Build Container Image

on:
  workflow_dispatch:
    inputs:
      push:
        description: 'Push to GHCR'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nubiferos/nubifer-tools

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Determine version
      id: version
      run: |
        VERSION=$(grep 'BRAND_VERSION=' brand/brand.conf | cut -d'"' -f2)
        COMMIT_SHA=$(git rev-parse --short HEAD)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
        echo "Version: $VERSION ($COMMIT_SHA)"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      if: inputs.push == true
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=${{ steps.version.outputs.version }}
          type=raw,value=${{ steps.version.outputs.version }}-${{ steps.version.outputs.commit_sha }}
          type=raw,value=latest

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        file: docker/Dockerfile
        push: ${{ inputs.push }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          NUBIFEROS_VERSION=${{ steps.version.outputs.version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build summary
      run: |
        cat >> $GITHUB_STEP_SUMMARY << EOF
        # 🐳 NubiferOS Container Image

        ## Version: ${{ steps.version.outputs.version }}

        ## Image Tags
        \`\`\`
        ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
        ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        \`\`\`

        ## Quick Start
        \`\`\`bash
        # Interactive shell with all cloud tools
        docker run -it ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

        # With AWS credentials
        docker run -it -v ~/.aws:/root/.aws ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

        # Run NubiferAI
        docker run -it -e ANTHROPIC_API_KEY ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} nubiferai front "list my resources"

        # In CI/CD pipeline
        docker run --rm -v ~/.aws:/root/.aws ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} aws s3 ls
        \`\`\`

        ## What's Inside
        - AWS CLI v2, Azure CLI, Google Cloud CLI
        - Terraform, kubectl, Helm
        - NubiferOS workspace manager + credential manager
        - NubiferAI CLI
        - Read-only mode CLI wrappers
        EOF
